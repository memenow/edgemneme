name: Deploy Workers

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bootstrap_expected_empty:
        description: Confirm that both core Workers are expected to be absent before this run
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-cloudflare
  queue: max
  cancel-in-progress: false

jobs:
  capture_production_state:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    outputs:
      orchestrator_previous_version: ${{ steps.capture_state.outputs.orchestrator_version }}
      gateway_previous_version: ${{ steps.capture_state.outputs.gateway_version }}
      gateway_previous_trigger_state: ${{ steps.capture_state.outputs.gateway_trigger_state }}
      gateway_previous_trigger_fingerprint: ${{ steps.capture_state.outputs.gateway_trigger_fingerprint }}
      github_sync_previous_version: ${{ steps.capture_state.outputs.github_sync_version }}
      github_sync_previous_state: ${{ steps.capture_state.outputs.github_sync_state }}
      github_sync_previous_schedule_state: ${{ steps.capture_state.outputs.github_sync_schedule_state }}
      github_sync_previous_secret_state: ${{ steps.capture_state.outputs.github_sync_secret_state }}
      bootstrap_mode: ${{ steps.capture_state.outputs.bootstrap_mode }}
      configuration_fingerprint: ${{ steps.capture_state.outputs.configuration_fingerprint }}
    steps:
      - name: Check out deployment source for state capture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify immutable state capture source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production state capture is allowed only from refs/heads/main." >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "Checked-out state capture source does not match GITHUB_SHA." >&2
            exit 1
          fi

      - name: Set up Node.js for state capture
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify current main state capture head
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-github-main-head.mjs

      - name: Capture production Worker state
        id: capture_state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_MEMORY_DATABASE_ID: ${{ vars.CF_D1_MEMORY_DATABASE_ID }}
          CF_D1_SEARCH_DATABASE_ID: ${{ vars.CF_D1_SEARCH_DATABASE_ID }}
          CF_RATE_LIMIT_NAMESPACE_EDGE: ${{ vars.CF_RATE_LIMIT_NAMESPACE_EDGE }}
          CF_RATE_LIMIT_NAMESPACE_CLIENT: ${{ vars.CF_RATE_LIMIT_NAMESPACE_CLIENT }}
          CF_RATE_LIMIT_NAMESPACE_PRINCIPAL: ${{ vars.CF_RATE_LIMIT_NAMESPACE_PRINCIPAL }}
          EDGEMNEME_BOOTSTRAP_EXPECTED_EMPTY: ${{ inputs.bootstrap_expected_empty }}
          ENABLE_GITHUB_SYNC: ${{ vars.ENABLE_GITHUB_SYNC }}
          GITHUB_CREDENTIAL_VERSION: ${{ vars.SYNC_CREDENTIAL_VERSION }}
          MEMORY_GATEWAY_ALLOWED_ORIGINS: ${{ vars.MEMORY_GATEWAY_ALLOWED_ORIGINS }}
          MEMORY_GATEWAY_CUSTOM_DOMAIN: ${{ vars.MEMORY_GATEWAY_CUSTOM_DOMAIN }}
        run: node scripts/capture-deployment-state.mjs

  validate_rollback_channel:
    if: github.ref == 'refs/heads/main'
    needs: capture_production_state
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-rollback
    steps:
      - name: Check out rollback validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js for rollback validation
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Validate unattended rollback channel
        env:
          CF_D1_MEMORY_DATABASE_ID: ${{ vars.CF_D1_MEMORY_DATABASE_ID }}
          CF_D1_SEARCH_DATABASE_ID: ${{ vars.CF_D1_SEARCH_DATABASE_ID }}
          CF_RATE_LIMIT_NAMESPACE_EDGE: ${{ vars.CF_RATE_LIMIT_NAMESPACE_EDGE }}
          CF_RATE_LIMIT_NAMESPACE_CLIENT: ${{ vars.CF_RATE_LIMIT_NAMESPACE_CLIENT }}
          CF_RATE_LIMIT_NAMESPACE_PRINCIPAL: ${{ vars.CF_RATE_LIMIT_NAMESPACE_PRINCIPAL }}
          ENABLE_GITHUB_SYNC: ${{ vars.ENABLE_GITHUB_SYNC }}
          GITHUB_CREDENTIAL_VERSION: ${{ vars.SYNC_CREDENTIAL_VERSION }}
          MEMORY_GATEWAY_ALLOWED_ORIGINS: ${{ vars.MEMORY_GATEWAY_ALLOWED_ORIGINS }}
          MEMORY_GATEWAY_CUSTOM_DOMAIN: ${{ vars.MEMORY_GATEWAY_CUSTOM_DOMAIN }}
          UNATTENDED_ROLLBACK_ENABLED: ${{ vars.UNATTENDED_ROLLBACK_ENABLED }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ROLLBACK_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ROLLBACK_ACCOUNT_ID }}
          EXPECTED_CONFIGURATION_FINGERPRINT: ${{ needs.capture_production_state.outputs.configuration_fingerprint }}
          EXPECTED_ORCHESTRATOR_VERSION: ${{ needs.capture_production_state.outputs.orchestrator_previous_version }}
          EXPECTED_GATEWAY_VERSION: ${{ needs.capture_production_state.outputs.gateway_previous_version }}
          EXPECTED_GATEWAY_TRIGGER_STATE: ${{ needs.capture_production_state.outputs.gateway_previous_trigger_state }}
          EXPECTED_GATEWAY_TRIGGER_FINGERPRINT: ${{ needs.capture_production_state.outputs.gateway_previous_trigger_fingerprint }}
          EXPECTED_GITHUB_SYNC_VERSION: ${{ needs.capture_production_state.outputs.github_sync_previous_version }}
          EXPECTED_GITHUB_SYNC_STATE: ${{ needs.capture_production_state.outputs.github_sync_previous_state }}
          EXPECTED_GITHUB_SYNC_SCHEDULE_STATE: ${{ needs.capture_production_state.outputs.github_sync_previous_schedule_state }}
          EXPECTED_GITHUB_SYNC_SECRET_STATE: ${{ needs.capture_production_state.outputs.github_sync_previous_secret_state }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$UNATTENDED_ROLLBACK_ENABLED" != "true" ]]; then
            echo "The rollback environment is not attested for unattended recovery." >&2
            exit 1
          fi
          node scripts/capture-deployment-state.mjs verify-configuration
          node scripts/capture-deployment-state.mjs verify \
            orchestrator_version \
            gateway_version \
            gateway_trigger_state \
            gateway_trigger_fingerprint \
            github_sync_version \
            github_sync_state \
            github_sync_schedule_state \
            github_sync_secret_state

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [capture_production_state, validate_rollback_channel]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify immutable deployment source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production deployment is allowed only from refs/heads/main." >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "Checked-out deployment source does not match GITHUB_SHA." >&2
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.18.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify current main deployment head
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-github-main-head.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate deployment inputs
        env:
          CF_D1_MEMORY_DATABASE_ID: ${{ vars.CF_D1_MEMORY_DATABASE_ID }}
          CF_D1_SEARCH_DATABASE_ID: ${{ vars.CF_D1_SEARCH_DATABASE_ID }}
          CF_RATE_LIMIT_NAMESPACE_EDGE: ${{ vars.CF_RATE_LIMIT_NAMESPACE_EDGE }}
          CF_RATE_LIMIT_NAMESPACE_CLIENT: ${{ vars.CF_RATE_LIMIT_NAMESPACE_CLIENT }}
          CF_RATE_LIMIT_NAMESPACE_PRINCIPAL: ${{ vars.CF_RATE_LIMIT_NAMESPACE_PRINCIPAL }}
          ENABLE_GITHUB_SYNC: ${{ vars.ENABLE_GITHUB_SYNC }}
          GITHUB_CREDENTIAL_VERSION: ${{ vars.SYNC_CREDENTIAL_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          required=(
            CF_D1_MEMORY_DATABASE_ID
            CF_D1_SEARCH_DATABASE_ID
            CF_RATE_LIMIT_NAMESPACE_EDGE
            CF_RATE_LIMIT_NAMESPACE_CLIENT
            CF_RATE_LIMIT_NAMESPACE_PRINCIPAL
          )
          if [[ "${ENABLE_GITHUB_SYNC:-}" != "true" && "${ENABLE_GITHUB_SYNC:-}" != "false" ]]; then
            echo "ENABLE_GITHUB_SYNC must be explicitly set to true or false." >&2
            exit 1
          fi
          if [[ "$ENABLE_GITHUB_SYNC" == "true" ]]; then
            required+=(GITHUB_CREDENTIAL_VERSION)
          fi
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Missing required production settings: ${missing[*]}" >&2
            exit 1
          fi
          for name in \
            CF_D1_MEMORY_DATABASE_ID \
            CF_D1_SEARCH_DATABASE_ID \
            CF_RATE_LIMIT_NAMESPACE_EDGE \
            CF_RATE_LIMIT_NAMESPACE_CLIENT \
            CF_RATE_LIMIT_NAMESPACE_PRINCIPAL; do
            echo "::add-mask::${!name}"
          done

      - name: Validate source and public Wrangler templates
        run: pnpm check

      - name: Verify captured production configuration
        timeout-minutes: 2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_MEMORY_DATABASE_ID: ${{ vars.CF_D1_MEMORY_DATABASE_ID }}
          CF_D1_SEARCH_DATABASE_ID: ${{ vars.CF_D1_SEARCH_DATABASE_ID }}
          CF_RATE_LIMIT_NAMESPACE_EDGE: ${{ vars.CF_RATE_LIMIT_NAMESPACE_EDGE }}
          CF_RATE_LIMIT_NAMESPACE_CLIENT: ${{ vars.CF_RATE_LIMIT_NAMESPACE_CLIENT }}
          CF_RATE_LIMIT_NAMESPACE_PRINCIPAL: ${{ vars.CF_RATE_LIMIT_NAMESPACE_PRINCIPAL }}
          ENABLE_GITHUB_SYNC: ${{ vars.ENABLE_GITHUB_SYNC }}
          GITHUB_CREDENTIAL_VERSION: ${{ vars.SYNC_CREDENTIAL_VERSION }}
          MEMORY_GATEWAY_ALLOWED_ORIGINS: ${{ vars.MEMORY_GATEWAY_ALLOWED_ORIGINS }}
          MEMORY_GATEWAY_CUSTOM_DOMAIN: ${{ vars.MEMORY_GATEWAY_CUSTOM_DOMAIN }}
          EXPECTED_CONFIGURATION_FINGERPRINT: ${{ needs.capture_production_state.outputs.configuration_fingerprint }}
        run: node scripts/capture-deployment-state.mjs verify-configuration

      - name: Render private deployment configs
        env:
          CF_D1_MEMORY_DATABASE_ID: ${{ vars.CF_D1_MEMORY_DATABASE_ID }}
          CF_D1_SEARCH_DATABASE_ID: ${{ vars.CF_D1_SEARCH_DATABASE_ID }}
          CF_RATE_LIMIT_NAMESPACE_EDGE: ${{ vars.CF_RATE_LIMIT_NAMESPACE_EDGE }}
          CF_RATE_LIMIT_NAMESPACE_CLIENT: ${{ vars.CF_RATE_LIMIT_NAMESPACE_CLIENT }}
          CF_RATE_LIMIT_NAMESPACE_PRINCIPAL: ${{ vars.CF_RATE_LIMIT_NAMESPACE_PRINCIPAL }}
          MEMORY_GATEWAY_ALLOWED_ORIGINS: ${{ vars.MEMORY_GATEWAY_ALLOWED_ORIGINS }}
          MEMORY_GATEWAY_CUSTOM_DOMAIN: ${{ vars.MEMORY_GATEWAY_CUSTOM_DOMAIN }}
          GITHUB_CREDENTIAL_VERSION: ${{ vars.SYNC_CREDENTIAL_VERSION }}
          ENABLE_GITHUB_SYNC: ${{ vars.ENABLE_GITHUB_SYNC }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/render-wrangler-config.mjs \
            memory-orchestrator memory-gateway github-sync

      - name: Require fully migrated remote D1 databases
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          config="wrangler/.wrangler/memory-orchestrator.generated.jsonc"
          check_no_pending() {
            local database="$1"
            local output
            if ! output="$(
              pnpm exec wrangler d1 migrations list "$database" --remote \
                --config "$config" 2>&1
            )"; then
              printf '%s\n' "$output" >&2
              echo "Unable to verify remote migrations for $database; deployment is blocked." >&2
              return 1
            fi
            printf '%s\n' "$output"
            if [[ "$output" != *"No migrations to apply!"* ]] || \
               [[ "$output" == *"Migrations to be applied:"* ]]; then
              echo "Pending or indeterminate migrations for $database; deployment is blocked." >&2
              return 1
            fi
          }
          check_no_pending MEMORY_DB
          check_no_pending SEARCH_DB

      - name: Validate rendered deployment configs
        env:
          ENABLE_GITHUB_SYNC: ${{ vars.ENABLE_GITHUB_SYNC }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler deploy --dry-run --config wrangler/.wrangler/memory-orchestrator.generated.jsonc
          pnpm exec wrangler deploy --dry-run --config wrangler/.wrangler/memory-gateway.generated.jsonc
          pnpm exec wrangler deploy --dry-run --config wrangler/.wrangler/github-sync.generated.jsonc

      - name: Revalidate Vectorize metadata admission
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-github-main-head.mjs

      - name: Reject pre-mutation deployment state drift
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_MEMORY_DATABASE_ID: ${{ vars.CF_D1_MEMORY_DATABASE_ID }}
          CF_D1_SEARCH_DATABASE_ID: ${{ vars.CF_D1_SEARCH_DATABASE_ID }}
          CF_RATE_LIMIT_NAMESPACE_EDGE: ${{ vars.CF_RATE_LIMIT_NAMESPACE_EDGE }}
          CF_RATE_LIMIT_NAMESPACE_CLIENT: ${{ vars.CF_RATE_LIMIT_NAMESPACE_CLIENT }}
          CF_RATE_LIMIT_NAMESPACE_PRINCIPAL: ${{ vars.CF_RATE_LIMIT_NAMESPACE_PRINCIPAL }}
          ENABLE_GITHUB_SYNC: ${{ vars.ENABLE_GITHUB_SYNC }}
          GITHUB_CREDENTIAL_VERSION: ${{ vars.SYNC_CREDENTIAL_VERSION }}
          MEMORY_GATEWAY_ALLOWED_ORIGINS: ${{ vars.MEMORY_GATEWAY_ALLOWED_ORIGINS }}
          MEMORY_GATEWAY_CUSTOM_DOMAIN: ${{ vars.MEMORY_GATEWAY_CUSTOM_DOMAIN }}
          EXPECTED_CONFIGURATION_FINGERPRINT: ${{ needs.capture_production_state.outputs.configuration_fingerprint }}
          EXPECTED_ORCHESTRATOR_VERSION: ${{ needs.capture_production_state.outputs.orchestrator_previous_version }}
          EXPECTED_GATEWAY_VERSION: ${{ needs.capture_production_state.outputs.gateway_previous_version }}
          EXPECTED_GATEWAY_TRIGGER_STATE: ${{ needs.capture_production_state.outputs.gateway_previous_trigger_state }}
          EXPECTED_GATEWAY_TRIGGER_FINGERPRINT: ${{ needs.capture_production_state.outputs.gateway_previous_trigger_fingerprint }}
          EXPECTED_GITHUB_SYNC_VERSION: ${{ needs.capture_production_state.outputs.github_sync_previous_version }}
          EXPECTED_GITHUB_SYNC_STATE: ${{ needs.capture_production_state.outputs.github_sync_previous_state }}
          EXPECTED_GITHUB_SYNC_SCHEDULE_STATE: ${{ needs.capture_production_state.outputs.github_sync_previous_schedule_state }}
          EXPECTED_GITHUB_SYNC_SECRET_STATE: ${{ needs.capture_production_state.outputs.github_sync_previous_secret_state }}
          EDGEMNEME_BOOTSTRAP_MODE: ${{ needs.capture_production_state.outputs.bootstrap_mode }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-github-main-head.mjs
          node scripts/capture-deployment-state.mjs verify-configuration
          node scripts/capture-deployment-state.mjs verify \
            orchestrator_version \
            gateway_version \
            gateway_trigger_state \
            gateway_trigger_fingerprint \
            github_sync_version \
            github_sync_state \
            github_sync_schedule_state \
            github_sync_secret_state
          node scripts/gateway-deployment-target.mjs verify-predeploy \
            wrangler/.wrangler/memory-gateway.generated.jsonc

      - name: Ensure semantic Vectorize metadata indexes
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          vectorize_index_name="edgemneme-memory"
          max_poll_attempts=30
          poll_interval_seconds=2

          list_metadata_indexes() {
            local output
            if ! output="$(
              pnpm exec wrangler vectorize list-metadata-index \
                "$vectorize_index_name" --json
            )"; then
              echo "Unable to list Vectorize metadata indexes; deployment is blocked." >&2
              return 1
            fi
            printf '%s' "$output"
          }

          inspect_metadata_indexes() {
            local metadata_indexes_json="$1"
            local validation_mode="$2"
            METADATA_INDEXES_JSON="$metadata_indexes_json" \
              METADATA_INDEX_VALIDATION_MODE="$validation_mode" \
              node --input-type=module <<'NODE'
          const requiredIndexes = new Map([
            ["model_generation", "string"],
            ["status", "string"],
            ["repository_partition", "string"],
            ["kind", "string"],
            ["memory_class", "string"],
            ["scope_key", "string"],
            ["valid_from_epoch_ms", "number"],
            ["valid_until_epoch_ms", "number"]
          ]);
          const validationMode = process.env.METADATA_INDEX_VALIDATION_MODE;
          if (validationMode !== "allow-missing" && validationMode !== "exact") {
            throw new Error("Vectorize metadata index validation mode is invalid.");
          }
          let indexes;
          try {
            indexes = JSON.parse(process.env.METADATA_INDEXES_JSON ?? "");
          } catch {
            throw new Error("Vectorize metadata index output is not valid JSON.");
          }
          if (!Array.isArray(indexes)) {
            throw new Error("Vectorize metadata index output must be a JSON array.");
          }
          const configuredIndexes = new Map();
          for (const index of indexes) {
            if (
              index === null ||
              typeof index !== "object" ||
              typeof index.propertyName !== "string" ||
              index.propertyName.length === 0 ||
              typeof index.indexType !== "string" ||
              index.indexType.length === 0
            ) {
              throw new Error("Vectorize metadata index output contains a malformed entry.");
            }
            const propertyName = index.propertyName;
            const indexType = index.indexType.toLowerCase();
            if (configuredIndexes.has(propertyName)) {
              throw new Error(`Vectorize contains duplicate metadata index ${propertyName}.`);
            }
            const requiredType = requiredIndexes.get(propertyName);
            if (requiredType === undefined) {
              throw new Error(`Vectorize contains unexpected metadata index ${propertyName}.`);
            }
            if (indexType !== requiredType) {
              throw new Error(
                `Vectorize metadata index ${propertyName} must use type ${requiredType}, found ${indexType}.`
              );
            }
            configuredIndexes.set(propertyName, indexType);
          }
          const missingIndexes = [...requiredIndexes].filter(
            ([propertyName]) => !configuredIndexes.has(propertyName)
          );
          if (validationMode === "exact" && missingIndexes.length > 0) {
            throw new Error(
              `Vectorize is missing required metadata indexes: ${missingIndexes
                .map(([propertyName]) => propertyName)
                .join(", ")}.`
            );
          }
          for (const [propertyName, indexType] of missingIndexes) {
            process.stdout.write(`${propertyName}\t${indexType}\n`);
          }
          NODE
          }

          metadata_indexes="$(list_metadata_indexes)"
          missing_indexes="$(inspect_metadata_indexes "$metadata_indexes" "allow-missing")"
          if [[ -z "$missing_indexes" ]]; then
            inspect_metadata_indexes "$metadata_indexes" "exact" >/dev/null
            echo "Vectorize metadata index set already satisfies the exact required contract."
            exit 0
          fi

          while IFS=$'\t' read -r property_name index_type; do
            if [[ -z "$property_name" ]]; then
              continue
            fi
            if [[ "$index_type" != "string" && "$index_type" != "number" ]]; then
              echo "Unsupported required Vectorize metadata index type; deployment is blocked." >&2
              exit 1
            fi
            if ! pnpm exec wrangler vectorize create-metadata-index \
              "$vectorize_index_name" \
              --property-name="$property_name" \
              --type="$index_type"; then
              echo "Unable to create Vectorize metadata index $property_name; deployment is blocked." >&2
              exit 1
            fi
          done <<< "$missing_indexes"

          metadata_indexes_ready=false
          for ((attempt = 1; attempt <= max_poll_attempts; attempt++)); do
            metadata_indexes="$(list_metadata_indexes)"
            missing_indexes="$(inspect_metadata_indexes "$metadata_indexes" "allow-missing")"
            if [[ -z "$missing_indexes" ]]; then
              inspect_metadata_indexes "$metadata_indexes" "exact" >/dev/null
              metadata_indexes_ready=true
              break
            fi
            if (( attempt < max_poll_attempts )); then
              sleep "$poll_interval_seconds"
            fi
          done
          if [[ "$metadata_indexes_ready" != "true" ]]; then
            echo "Vectorize metadata indexes did not reach the exact required contract after $max_poll_attempts polling attempts; deployment is blocked." >&2
            exit 1
          fi
          echo "Vectorize metadata index set satisfies the exact required contract."

      - name: Prepare isolated canary identity
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { randomUUID } from "node:crypto";
          import { appendFileSync } from "node:fs";
          import { join } from "node:path";

          const projectId = randomUUID();
          const values = {
            EDGEMNEME_CANARY_PROJECT_ID: projectId,
            EDGEMNEME_CANARY_PRINCIPAL_ID: randomUUID(),
            EDGEMNEME_CANARY_PROMOTION_CANDIDATE_ID: randomUUID(),
            EDGEMNEME_CANARY_CLEANUP_LEDGER: join(
              process.env.RUNNER_TEMP,
              `edgemneme-canary-${projectId}.json`
            )
          };
          appendFileSync(
            process.env.GITHUB_ENV,
            Object.entries(values).map(([name, value]) => `${name}=${value}\n`).join("")
          );
          NODE

      - name: Check projection rebuild deployment budget
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm projection:rebuild:plan --resume --max-wait-seconds 3600

      - name: Capture pre-deployment Worker versions
        id: capture_core_versions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EDGEMNEME_BOOTSTRAP_EXPECTED_EMPTY: ${{ inputs.bootstrap_expected_empty }}
          ENABLE_GITHUB_SYNC: ${{ vars.ENABLE_GITHUB_SYNC }}
        shell: bash
        run: |
          set -euo pipefail
          worker_state() {
            local worker_name="$1"
            WORKER_NAME="$worker_name" node --input-type=module <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const workerName = process.env.WORKER_NAME;
