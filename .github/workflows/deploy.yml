name: Deploy Workers

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deployment_mode:
        description: Assert the exact core Worker state expected before this deployment
        required: true
        default: normal
        type: choice
        options:
          - normal
          - bootstrap-empty
          - bootstrap-recover-gateway

permissions:
  contents: read

concurrency:
  group: production-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify immutable deployment source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production deployment is allowed only from refs/heads/main." >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "Checked-out deployment source does not match GITHUB_SHA." >&2
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.18.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify current main deployment head
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-github-main-head.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate deployment inputs
        env:
          CF_D1_MEMORY_DATABASE_ID: ${{ vars.CF_D1_MEMORY_DATABASE_ID }}
          CF_D1_SEARCH_DATABASE_ID: ${{ vars.CF_D1_SEARCH_DATABASE_ID }}
          CF_RATE_LIMIT_NAMESPACE_EDGE: ${{ vars.CF_RATE_LIMIT_NAMESPACE_EDGE }}
          CF_RATE_LIMIT_NAMESPACE_CLIENT: ${{ vars.CF_RATE_LIMIT_NAMESPACE_CLIENT }}
          CF_RATE_LIMIT_NAMESPACE_PRINCIPAL: ${{ vars.CF_RATE_LIMIT_NAMESPACE_PRINCIPAL }}
          ENABLE_GITHUB_SYNC: ${{ vars.ENABLE_GITHUB_SYNC }}
          GITHUB_CREDENTIAL_VERSION: ${{ vars.SYNC_CREDENTIAL_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          required=(
            CF_D1_MEMORY_DATABASE_ID
            CF_D1_SEARCH_DATABASE_ID
            CF_RATE_LIMIT_NAMESPACE_EDGE
            CF_RATE_LIMIT_NAMESPACE_CLIENT
            CF_RATE_LIMIT_NAMESPACE_PRINCIPAL
          )
          if [[ "${ENABLE_GITHUB_SYNC:-}" != "true" && "${ENABLE_GITHUB_SYNC:-}" != "false" ]]; then
            echo "ENABLE_GITHUB_SYNC must be explicitly set to true or false." >&2
            exit 1
          fi
          if [[ "$ENABLE_GITHUB_SYNC" == "true" ]]; then
            required+=(GITHUB_CREDENTIAL_VERSION)
          fi
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Missing required production settings: ${missing[*]}" >&2
            exit 1
          fi
          for name in \
            CF_D1_MEMORY_DATABASE_ID \
            CF_D1_SEARCH_DATABASE_ID \
            CF_RATE_LIMIT_NAMESPACE_EDGE \
            CF_RATE_LIMIT_NAMESPACE_CLIENT \
            CF_RATE_LIMIT_NAMESPACE_PRINCIPAL; do
            echo "::add-mask::${!name}"
          done

      - name: Validate source and public Wrangler templates
        run: pnpm check

      - name: Render private deployment configs
        env:
          CF_D1_MEMORY_DATABASE_ID: ${{ vars.CF_D1_MEMORY_DATABASE_ID }}
          CF_D1_SEARCH_DATABASE_ID: ${{ vars.CF_D1_SEARCH_DATABASE_ID }}
          CF_RATE_LIMIT_NAMESPACE_EDGE: ${{ vars.CF_RATE_LIMIT_NAMESPACE_EDGE }}
          CF_RATE_LIMIT_NAMESPACE_CLIENT: ${{ vars.CF_RATE_LIMIT_NAMESPACE_CLIENT }}
          CF_RATE_LIMIT_NAMESPACE_PRINCIPAL: ${{ vars.CF_RATE_LIMIT_NAMESPACE_PRINCIPAL }}
          MEMORY_GATEWAY_ALLOWED_ORIGINS: ${{ vars.MEMORY_GATEWAY_ALLOWED_ORIGINS }}
          MEMORY_GATEWAY_CUSTOM_DOMAIN: ${{ vars.MEMORY_GATEWAY_CUSTOM_DOMAIN }}
          GITHUB_CREDENTIAL_VERSION: ${{ vars.SYNC_CREDENTIAL_VERSION }}
          ENABLE_GITHUB_SYNC: ${{ vars.ENABLE_GITHUB_SYNC }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/render-wrangler-config.mjs \
            memory-orchestrator memory-gateway github-sync

      - name: Require fully migrated remote D1 databases
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          config="wrangler/.wrangler/memory-orchestrator.generated.jsonc"
          check_no_pending() {
            local database="$1"
            local output
            if ! output="$(
              pnpm exec wrangler d1 migrations list "$database" --remote \
                --config "$config" 2>&1
            )"; then
              printf '%s\n' "$output" >&2
              echo "Unable to verify remote migrations for $database; deployment is blocked." >&2
              return 1
            fi
            printf '%s\n' "$output"
            if [[ "$output" != *"No migrations to apply!"* ]] || \
               [[ "$output" == *"Migrations to be applied:"* ]]; then
              echo "Pending or indeterminate migrations for $database; deployment is blocked." >&2
              return 1
            fi
          }
          check_no_pending MEMORY_DB
          check_no_pending SEARCH_DB

      - name: Validate rendered deployment configs
        env:
          ENABLE_GITHUB_SYNC: ${{ vars.ENABLE_GITHUB_SYNC }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler deploy --dry-run --config wrangler/.wrangler/memory-orchestrator.generated.jsonc
          pnpm exec wrangler deploy --dry-run --config wrangler/.wrangler/memory-gateway.generated.jsonc
          pnpm exec wrangler deploy --dry-run --config wrangler/.wrangler/github-sync.generated.jsonc

      - name: Revalidate Vectorize metadata admission
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-github-main-head.mjs

      - name: Ensure semantic Vectorize metadata indexes
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          vectorize_index_name="edgemneme-memory"
          max_poll_attempts=30
          poll_interval_seconds=2

          list_metadata_indexes() {
            local output
            if ! output="$(
              pnpm exec wrangler vectorize list-metadata-index \
                "$vectorize_index_name" --json
            )"; then
              echo "Unable to list Vectorize metadata indexes; deployment is blocked." >&2
              return 1
            fi
            printf '%s' "$output"
          }

          inspect_metadata_indexes() {
            local metadata_indexes_json="$1"
            local validation_mode="$2"
            METADATA_INDEXES_JSON="$metadata_indexes_json" \
              METADATA_INDEX_VALIDATION_MODE="$validation_mode" \
              node --input-type=module <<'NODE'
          const requiredIndexes = new Map([
            ["model_generation", "string"],
            ["status", "string"],
            ["repository_partition", "string"],
            ["kind", "string"],
            ["memory_class", "string"],
            ["scope_key", "string"],
            ["valid_from_epoch_ms", "number"],
            ["valid_until_epoch_ms", "number"]
          ]);
          const validationMode = process.env.METADATA_INDEX_VALIDATION_MODE;
          if (validationMode !== "allow-missing" && validationMode !== "exact") {
            throw new Error("Vectorize metadata index validation mode is invalid.");
          }
          let indexes;
          try {
            indexes = JSON.parse(process.env.METADATA_INDEXES_JSON ?? "");
          } catch {
            throw new Error("Vectorize metadata index output is not valid JSON.");
          }
          if (!Array.isArray(indexes)) {
            throw new Error("Vectorize metadata index output must be a JSON array.");
          }
          const configuredIndexes = new Map();
          for (const index of indexes) {
            if (
              index === null ||
              typeof index !== "object" ||
              typeof index.propertyName !== "string" ||
              index.propertyName.length === 0 ||
              typeof index.indexType !== "string" ||
              index.indexType.length === 0
            ) {
              throw new Error("Vectorize metadata index output contains a malformed entry.");
            }
            const propertyName = index.propertyName;
            const indexType = index.indexType.toLowerCase();
            if (configuredIndexes.has(propertyName)) {
              throw new Error(`Vectorize contains duplicate metadata index ${propertyName}.`);
            }
            const requiredType = requiredIndexes.get(propertyName);
            if (requiredType === undefined) {
              throw new Error(`Vectorize contains unexpected metadata index ${propertyName}.`);
            }
            if (indexType !== requiredType) {
              throw new Error(
                `Vectorize metadata index ${propertyName} must use type ${requiredType}, found ${indexType}.`
              );
            }
            configuredIndexes.set(propertyName, indexType);
          }
          const missingIndexes = [...requiredIndexes].filter(
            ([propertyName]) => !configuredIndexes.has(propertyName)
          );
          if (validationMode === "exact" && missingIndexes.length > 0) {
            throw new Error(
              `Vectorize is missing required metadata indexes: ${missingIndexes
                .map(([propertyName]) => propertyName)
                .join(", ")}.`
            );
          }
          for (const [propertyName, indexType] of missingIndexes) {
            process.stdout.write(`${propertyName}\t${indexType}\n`);
          }
          NODE
          }

          metadata_indexes="$(list_metadata_indexes)"
          missing_indexes="$(inspect_metadata_indexes "$metadata_indexes" "allow-missing")"
          if [[ -z "$missing_indexes" ]]; then
            inspect_metadata_indexes "$metadata_indexes" "exact" >/dev/null
            echo "Vectorize metadata index set already satisfies the exact required contract."
            exit 0
          fi

          while IFS=$'\t' read -r property_name index_type; do
            if [[ -z "$property_name" ]]; then
              continue
            fi
            if [[ "$index_type" != "string" && "$index_type" != "number" ]]; then
              echo "Unsupported required Vectorize metadata index type; deployment is blocked." >&2
              exit 1
            fi
            if ! pnpm exec wrangler vectorize create-metadata-index \
              "$vectorize_index_name" \
              --property-name="$property_name" \
              --type="$index_type"; then
              echo "Unable to create Vectorize metadata index $property_name; deployment is blocked." >&2
              exit 1
            fi
          done <<< "$missing_indexes"

          metadata_indexes_ready=false
          for ((attempt = 1; attempt <= max_poll_attempts; attempt++)); do
            metadata_indexes="$(list_metadata_indexes)"
            missing_indexes="$(inspect_metadata_indexes "$metadata_indexes" "allow-missing")"
            if [[ -z "$missing_indexes" ]]; then
              inspect_metadata_indexes "$metadata_indexes" "exact" >/dev/null
              metadata_indexes_ready=true
              break
            fi
            if (( attempt < max_poll_attempts )); then
              sleep "$poll_interval_seconds"
            fi
          done
          if [[ "$metadata_indexes_ready" != "true" ]]; then
            echo "Vectorize metadata indexes did not reach the exact required contract after $max_poll_attempts polling attempts; deployment is blocked." >&2
            exit 1
          fi
          echo "Vectorize metadata index set satisfies the exact required contract."

      - name: Check projection rebuild deployment budget
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm projection:rebuild:plan --resume --max-wait-seconds 3600

      - name: Deploy memory orchestrator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm exec wrangler deploy --strict
          --tag "edgemneme-ledger-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-orchestrator"
          --config wrangler/.wrangler/memory-orchestrator.generated.jsonc

      - name: Rebuild and verify projections
        timeout-minutes: 65
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm projection:rebuild:enqueue --resume --max-wait-seconds 3600
          pnpm projection:rebuild:verify --wait-seconds 3600

      - name: Create ephemeral gateway secret file
        env:
          TOKEN_DIGEST_PEPPER: ${{ secrets.TOKEN_DIGEST_PEPPER }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from "node:fs";

          const directory = "wrangler/.wrangler";
          mkdirSync(directory, { recursive: true, mode: 0o700 });
          const entries = ["TOKEN_DIGEST_PEPPER"].map((name) => {
            const value = process.env[name];
            if (!value) {
              throw new Error(`Required Worker secret ${name} is missing.`);
            }
            return [name, value];
          });
          writeFileSync(
            `${directory}/memory-gateway.secrets.json`,
            `${JSON.stringify(Object.fromEntries(entries))}\n`,
            { mode: 0o600 }
          );
          NODE

      - name: Deploy memory gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm exec wrangler deploy --strict
          --tag "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-gateway"
          --config wrangler/.wrangler/memory-gateway.generated.jsonc
          --secrets-file wrangler/.wrangler/memory-gateway.secrets.json

      - name: Remove gateway secret file
        if: always()
        run: rm -f -- wrangler/.wrangler/memory-gateway.secrets.json

      - name: Create ephemeral GitHub sync secret file
        if: vars.ENABLE_GITHUB_SYNC == 'true'
        env:
          GITHUB_CLASSIC_TOKEN: ${{ secrets.GITHUB_CLASSIC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from "node:fs";

          const token = process.env.GITHUB_CLASSIC_TOKEN;
          if (!token) {
            throw new Error("Required Worker secret GITHUB_CLASSIC_TOKEN is missing.");
          }
          const directory = "wrangler/.wrangler";
          mkdirSync(directory, { recursive: true, mode: 0o700 });
          writeFileSync(
            `${directory}/github-sync.secrets.json`,
            `${JSON.stringify({ GITHUB_CLASSIC_TOKEN: token })}\n`,
            { mode: 0o600 }
          );
          NODE

      - name: Deploy GitHub sync
        if: vars.ENABLE_GITHUB_SYNC == 'true'
        timeout-minutes: 35
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_CREDENTIAL_VERSION: ${{ vars.SYNC_CREDENTIAL_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          config="wrangler/.wrangler/github-sync.generated.jsonc"
          active_version() {
            local deployments
            deployments="$(pnpm exec wrangler deployments list --config "$config" --json)" || return 1
            DEPLOYMENTS_JSON="$deployments" node --input-type=module <<'NODE'
          const deployments = JSON.parse(process.env.DEPLOYMENTS_JSON ?? "");
          if (!Array.isArray(deployments) || deployments.length === 0) {
            throw new Error("The GitHub sync Worker has no active deployment.");
          }
          const candidates = deployments.map((deployment) => {
            const createdAt = Date.parse(deployment?.created_on);
            if (!Number.isFinite(createdAt)) {
              throw new Error("A GitHub sync deployment has an invalid creation timestamp.");
            }
            return { deployment, createdAt };
          });
          const latest = candidates.reduce((selected, candidate) =>
            candidate.createdAt > selected.createdAt ? candidate : selected
          ).deployment;
          if (
            !Array.isArray(latest.versions) ||
            latest.versions.length !== 1 ||
            typeof latest.versions[0]?.version_id !== "string" ||
            !/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(
              latest.versions[0].version_id
            ) ||
            latest.versions[0]?.percentage !== 100
          ) {
            throw new Error("The active GitHub sync deployment is not a single 100% version.");
          }
          process.stdout.write(latest.versions[0].version_id);
          NODE
          }
          tagged_current_version() {
            local version_id="$1"
            local expected_tag="$2"
            local version
            version="$(
              pnpm exec wrangler versions view "$version_id" --config "$config" --json
            )" || return 1
            VERSION_JSON="$version" VERSION_ID="$version_id" EXPECTED_TAG="$expected_tag" \
              node --input-type=module <<'NODE'
          const version = JSON.parse(process.env.VERSION_JSON ?? "");
          if (
            typeof version !== "object" || version === null || Array.isArray(version) ||
            !process.env.VERSION_ID || !process.env.EXPECTED_TAG ||
            version.id !== process.env.VERSION_ID
          ) {
            throw new Error("The GitHub sync Worker version metadata is invalid.");
          }
          process.stdout.write(
            version.annotations?.["workers/tag"] === process.env.EXPECTED_TAG ? version.id : ""
          );
          NODE
          }
          version_has_exact_enabled_github_contract() {
            local version_id="$1"
            VERSION_ID="$version_id" node --input-type=module <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const versionId = process.env.VERSION_ID;
          const credentialVersion = process.env.GITHUB_CREDENTIAL_VERSION;
          if (!accountId || !token || !versionId || !credentialVersion) {
            throw new Error("The enabled GitHub sync version inputs are invalid.");
          }
          const response = await fetch(
            `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(accountId)}` +
              `/workers/scripts/edgemneme-github-sync/versions/${encodeURIComponent(versionId)}`,
            { headers: { Authorization: `Bearer ${token}` }, redirect: "manual" }
          );
          if (!response.ok) {
            throw new Error(
              `Cloudflare enabled GitHub sync version query failed with HTTP ${response.status}.`
            );
          }
          const envelope = await response.json();
          const result = envelope?.result;
          const bindings = result?.resources?.bindings;
          if (
            envelope?.success !== true || result?.id !== versionId || !Array.isArray(bindings)
          ) {
            throw new Error("The enabled GitHub sync version response is invalid.");
          }
          const expected = new Map([
            ["GITHUB_DISPATCH_WORKFLOW", [
              "edgemneme-github-dispatch-workflow", "GitHubDispatchWorkflow"
            ]],
            ["GITHUB_REF_SYNC_WORKFLOW", [
              "edgemneme-github-ref-sync-workflow", "GitHubRefSyncWorkflow"
            ]],
            ["GITHUB_RETENTION_WORKFLOW", [
              "edgemneme-github-retention-workflow", "GitHubRetentionWorkflow"
            ]]
          ]);
          const workflows = bindings.filter((binding) => binding?.type === "workflow");
          const runtime = bindings.filter(
            (binding) => binding?.type === "plain_text" && binding?.name === "GITHUB_SYNC_ENABLED"
          );
          const credential = bindings.filter(
            (binding) => binding?.type === "plain_text" &&
              binding?.name === "GITHUB_CREDENTIAL_VERSION"
          );
          const secrets = bindings.filter(
            (binding) => binding?.type === "secret_text" || binding?.type === "secret_key"
          );
          const compatible =
            !bindings.some((binding) => binding?.type === "queue") &&
            secrets.length === 1 && secrets[0]?.type === "secret_text" &&
            secrets[0]?.name === "GITHUB_CLASSIC_TOKEN" &&
            runtime.length === 1 && runtime[0]?.text === "true" &&
            credential.length === 1 && credential[0]?.text === credentialVersion &&
            workflows.length === expected.size &&
            workflows.every((binding) => {
              const contract = expected.get(binding?.name);
              return contract !== undefined &&
                binding.workflow_name === contract[0] &&
                binding.class_name === contract[1] &&
                (binding.script_name === undefined ||
                  binding.script_name === "edgemneme-github-sync");
            }) &&
            new Set(workflows.map((binding) => binding.name)).size === expected.size;
          process.stdout.write(compatible ? "compatible" : "incompatible");
          NODE
          }
          github_sync_queue_state() {
            node --input-type=module <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!accountId || !token) {
            throw new Error("Cloudflare Queue lifecycle inputs are incomplete.");
          }
          const base = `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(accountId)}`;
          const headers = { Authorization: `Bearer ${token}` };
          const request = async (url) => {
            const response = await fetch(url, { headers, redirect: "manual" });
            if (!response.ok) {
              throw new Error(`Cloudflare Queue query failed with HTTP ${response.status}.`);
            }
            const envelope = await response.json();
            if (envelope?.success !== true) {
              throw new Error("The Cloudflare Queue response is invalid.");
            }
            return envelope;
          };
          const queueIds = new Set();
          let totalCount;
          let totalPages;
          for (let page = 1; page <= 10_000; page += 1) {
            const url = new URL(`${base}/queues`);
            url.searchParams.set("page", String(page));
            url.searchParams.set("per_page", "100");
            const envelope = await request(url);
            const info = envelope?.result_info;
            if (
              !Array.isArray(envelope.result) ||
              !Number.isSafeInteger(info?.count) || info.count !== envelope.result.length ||
              !Number.isSafeInteger(info?.page) || info.page !== page ||
              !Number.isSafeInteger(info?.per_page) || info.per_page < 1 ||
              info.count > info.per_page ||
              !Number.isSafeInteger(info?.total_count) || info.total_count < 0 ||
              !Number.isSafeInteger(info?.total_pages) || info.total_pages < 0 ||
              (info.total_count > 0 &&
                info.total_pages !== Math.ceil(info.total_count / info.per_page)) ||
              (info.total_count === 0 && ![0, 1].includes(info.total_pages))
            ) {
              throw new Error("The Cloudflare Queue inventory pagination is invalid.");
            }
            totalCount ??= info.total_count;
            totalPages ??= info.total_pages;
            if (info.total_count !== totalCount || info.total_pages !== totalPages) {
              throw new Error("The Cloudflare Queue inventory changed during pagination.");
            }
            for (const queue of envelope.result) {
              if (
                typeof queue?.queue_id !== "string" || queue.queue_id.length === 0 ||
                typeof queue?.queue_name !== "string" || queue.queue_name.length === 0 ||
                queueIds.has(queue.queue_id) ||
                !Number.isSafeInteger(queue?.consumers_total_count) ||
                queue.consumers_total_count < 0 ||
                !Number.isSafeInteger(queue?.producers_total_count) ||
                queue.producers_total_count < 0 ||
                (queue.consumers !== undefined && !Array.isArray(queue.consumers)) ||
                (queue.producers !== undefined && !Array.isArray(queue.producers))
              ) {
                throw new Error("The Cloudflare Queue inventory contains an invalid entry.");
              }
              queueIds.add(queue.queue_id);
              let consumers = queue.consumers ?? [];
              if (consumers.length > queue.consumers_total_count) {
                throw new Error("A Cloudflare Queue consumer count is invalid.");
              }
              if (consumers.length !== queue.consumers_total_count) {
                const consumerEnvelope = await request(
                  `${base}/queues/${encodeURIComponent(queue.queue_id)}/consumers`
                );
                if (
                  !Array.isArray(consumerEnvelope.result) ||
                  consumerEnvelope.result.length !== queue.consumers_total_count
                ) {
                  throw new Error("A Cloudflare Queue consumer inventory is incomplete.");
                }
                consumers = consumerEnvelope.result;
              }
              const producers = queue.producers ?? [];
              if (producers.length !== queue.producers_total_count) {
                throw new Error("A Cloudflare Queue producer inventory is incomplete.");
              }
              const consumerIds = new Set();
              for (const consumer of consumers) {
                const workerScripts = [consumer?.script, consumer?.service, consumer?.script_name]
                  .filter((value) => value !== undefined && value !== null);
                const validWorkerScript = (value) =>
                  typeof value === "string" &&
                  value.length > 0 &&
                  value.length <= 512 &&
                  value.trim() === value &&
                  !/[\u0000-\u001f\u007f]/u.test(value);
                const workerScript =
                  workerScripts.length > 0 &&
                  workerScripts.every(validWorkerScript) &&
                  new Set(workerScripts).size === 1
                    ? workerScripts[0]
                    : null;
                if (
                  typeof consumer?.consumer_id !== "string" ||
                  consumer.consumer_id.length === 0 ||
                  consumerIds.has(consumer.consumer_id) ||
                  !["worker", "http_pull"].includes(consumer?.type) ||
                  (consumer.type === "worker" && workerScript === null)
                ) {
                  throw new Error("A Cloudflare Queue consumer entry is invalid.");
                }
                consumerIds.add(consumer.consumer_id);
                if (workerScript === "edgemneme-github-sync") {
                  throw new Error("The GitHub sync Worker still has a Queue consumer.");
                }
              }
              for (const producer of producers) {
                if (
                  (producer?.type !== "worker" && producer?.type !== "r2_bucket") ||
                  (producer.type === "worker" &&
                    (typeof producer.script !== "string" || producer.script.length === 0)) ||
                  (producer.type === "r2_bucket" &&
                    (typeof producer.bucket_name !== "string" || producer.bucket_name.length === 0))
                ) {
                  throw new Error("A Cloudflare Queue producer entry is invalid.");
                }
                if (producer?.script === "edgemneme-github-sync") {
                  throw new Error("The GitHub sync Worker still has a Queue producer.");
                }
              }
            }
            if (page >= Math.max(1, totalPages)) break;
            if (page === 10_000) {
              throw new Error("Cloudflare Queue inventory pagination exceeded its safety bound.");
            }
          }
          if (queueIds.size !== totalCount) {
            throw new Error("The Cloudflare Queue inventory count is inconsistent.");
          }
          process.stdout.write("clear");
          NODE
          }
          assert_active_tagged_version() {
            local expected_version="$1"
            local expected_tag="$2"
            local active
            local capability
            local queue_state
            local tagged
            active="$(active_version)" || return 1
            if [[ "$active" != "$expected_version" ]]; then
              echo "The active GitHub sync Worker changed during enabled verification." >&2
              return 1
            fi
            tagged="$(tagged_current_version "$active" "$expected_tag")" || return 1
            if [[ -z "$tagged" || "$tagged" != "$active" ]]; then
              echo "The active GitHub sync Worker is not exactly this run's tagged version." >&2
              return 1
            fi
            capability="$(version_has_exact_enabled_github_contract "$active")" || return 1
            if [[ "$capability" != "compatible" ]]; then
              echo "The enabled GitHub sync Worker does not have the exact remote binding contract." >&2
              return 1
            fi
            queue_state="$(github_sync_queue_state)" || return 1
            if [[ "$queue_state" != "clear" ]]; then
              echo "The enabled GitHub sync Worker still has a Queue association." >&2
              return 1
            fi
          }
          expected_tag="edgemneme-github-workflows-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-enabled"
          pnpm exec wrangler deploy --strict \
            --tag "$expected_tag" \
            --config "$config" \
            --secrets-file wrangler/.wrangler/github-sync.secrets.json
          deployed_version="$(active_version)"
          assert_active_tagged_version "$deployed_version" "$expected_tag"
          secrets="$(pnpm exec wrangler secret list --config "$config" --format json)"
          schedules="$(node --input-type=module <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!accountId || !token) {
            throw new Error("Cloudflare schedule verification inputs are incomplete.");
          }
          const response = await fetch(
            `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(accountId)}` +
              "/workers/scripts/edgemneme-github-sync/schedules",
            { headers: { Authorization: `Bearer ${token}` }, redirect: "manual" }
          );
          if (!response.ok) {
            throw new Error(`Cloudflare schedule query failed with HTTP ${response.status}.`);
          }
          const envelope = await response.json();
          if (envelope?.success !== true || !Array.isArray(envelope?.result?.schedules)) {
            throw new Error("The Cloudflare schedule response is invalid.");
          }
          process.stdout.write(JSON.stringify(envelope.result.schedules));
          NODE
          )"
          node --input-type=module <<'NODE'
          const workflowContracts = [
            ["edgemneme-github-dispatch-workflow", "GitHubDispatchWorkflow"],
            ["edgemneme-github-ref-sync-workflow", "GitHubRefSyncWorkflow"],
            ["edgemneme-github-retention-workflow", "GitHubRetentionWorkflow"]
          ];
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!accountId || !token) {
            throw new Error("Cloudflare Workflow verification inputs are incomplete.");
          }
          const base = `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(accountId)}`;
          const headers = { Authorization: `Bearer ${token}` };
          const request = async (url) => {
            const response = await fetch(url, { headers, redirect: "manual" });
            if (!response.ok) {
              throw new Error(`Cloudflare Workflow verification failed with HTTP ${response.status}.`);
            }
            const envelope = await response.json();
            if (envelope?.success !== true) {
              throw new Error("The Cloudflare Workflow verification response is invalid.");
            }
            return envelope;
          };
          const expectedInventory = new Map(workflowContracts);
          const workflowInventoryNames = new Set();
          const accountWorkflowIds = new Set();
          const accountWorkflowNames = new Set();
          let inventoryTotalCount;
          let inventoryTotalPages;
          for (let page = 1; page <= 10_000; page += 1) {
            const url = new URL(`${base}/workflows`);
            url.searchParams.set("page", String(page));
            url.searchParams.set("per_page", "100");
            const envelope = await request(url);
            const info = envelope?.result_info;
            if (
              !Array.isArray(envelope.result) ||
              !Number.isSafeInteger(info?.count) || info.count !== envelope.result.length ||
              !Number.isSafeInteger(info?.page) || info.page !== page ||
              !Number.isSafeInteger(info?.per_page) || info.per_page !== 100 ||
              !Number.isSafeInteger(info?.total_count) || info.total_count < 0 ||
              !Number.isSafeInteger(info?.total_pages) || info.total_pages < 0 ||
              (info.total_count > 0 &&
                info.total_pages !== Math.ceil(info.total_count / info.per_page)) ||
              (info.total_count === 0 && ![0, 1].includes(info.total_pages))
            ) {
              throw new Error("The Cloudflare Workflow inventory pagination is invalid.");
            }
            inventoryTotalCount ??= info.total_count;
            inventoryTotalPages ??= info.total_pages;
            if (
              info.total_count !== inventoryTotalCount ||
              info.total_pages !== inventoryTotalPages
            ) {
              throw new Error("The Cloudflare Workflow inventory changed during pagination.");
            }
            for (const workflow of envelope.result) {
              if (
                typeof workflow?.id !== "string" || workflow.id.length === 0 ||
                typeof workflow?.name !== "string" || workflow.name.length === 0 ||
                typeof workflow?.script_name !== "string" || workflow.script_name.length === 0 ||
                accountWorkflowIds.has(workflow.id) || accountWorkflowNames.has(workflow.name)
              ) {
                throw new Error("The Cloudflare Workflow inventory contains an invalid entry.");
              }
              accountWorkflowIds.add(workflow.id);
              accountWorkflowNames.add(workflow.name);
              if (workflow.script_name !== "edgemneme-github-sync") continue;
              const expectedClass = expectedInventory.get(workflow.name);
              if (
                expectedClass === undefined || workflow.class_name !== expectedClass ||
                (workflow.schedules !== undefined &&
                  (!Array.isArray(workflow.schedules) || workflow.schedules.length !== 0))
              ) {
                throw new Error("The GitHub sync Workflow inventory is not the exact approved set.");
              }
              workflowInventoryNames.add(workflow.name);
            }
            if (page >= Math.max(1, inventoryTotalPages)) break;
            if (page === 10_000) {
              throw new Error("Cloudflare Workflow inventory pagination exceeded its safety bound.");
            }
          }
          if (
            accountWorkflowIds.size !== inventoryTotalCount ||
            workflowInventoryNames.size !== expectedInventory.size ||
            [...expectedInventory.keys()].some((name) => !workflowInventoryNames.has(name))
          ) {
            throw new Error("The GitHub sync Workflow inventory is not the exact approved set.");
          }
          for (const [name, className] of workflowContracts) {
            const envelope = await request(`${base}/workflows/${encodeURIComponent(name)}`);
            const workflow = envelope?.result;
            if (
              envelope?.success !== true ||
              workflow?.name !== name ||
              workflow?.class_name !== className ||
              workflow?.script_name !== "edgemneme-github-sync" ||
              (workflow?.schedules !== undefined &&
                (!Array.isArray(workflow.schedules) || workflow.schedules.length !== 0))
            ) {
              throw new Error("A GitHub sync Workflow definition does not match the approved contract.");
            }
          }
          NODE
          SECRETS_JSON="$secrets" SCHEDULES_JSON="$schedules" node --input-type=module <<'NODE'
          const secrets = JSON.parse(process.env.SECRETS_JSON ?? "");
          const schedules = JSON.parse(process.env.SCHEDULES_JSON ?? "");
          if (!Array.isArray(secrets) || !Array.isArray(schedules)) {
            throw new Error("GitHub sync lifecycle verification output is invalid.");
          }
          if (
            secrets.length !== 1 ||
            secrets[0]?.name !== "GITHUB_CLASSIC_TOKEN" ||
            secrets[0]?.type !== "secret_text"
          ) {
            throw new Error(
              "Enabled GitHub sync must have only the GITHUB_CLASSIC_TOKEN binding."
            );
          }
          if (schedules.length !== 1 || schedules[0]?.cron !== "0 */6 * * *") {
            throw new Error("Enabled GitHub sync must have exactly one approved Cron Trigger.");
          }
          NODE
          assert_active_tagged_version "$deployed_version" "$expected_tag"

      - name: Deploy disabled GitHub sync
        if: vars.ENABLE_GITHUB_SYNC == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm exec wrangler deploy --strict
          --tag "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-github-sync-disabled"
          --config wrangler/.wrangler/github-sync.generated.jsonc

      - name: Remove GitHub sync secret file
        if: always() && vars.ENABLE_GITHUB_SYNC == 'true'
        run: rm -f -- wrangler/.wrangler/github-sync.secrets.json

      - name: Remove ephemeral deployment files
        if: always()
        shell: bash
        run: |
          rm -f -- \
            wrangler/.wrangler/memory-orchestrator.generated.jsonc \
            wrangler/.wrangler/memory-gateway.generated.jsonc \
            wrangler/.wrangler/github-sync.generated.jsonc \
            wrangler/.wrangler/memory-gateway.secrets.json \
            wrangler/.wrangler/github-sync.secrets.json
