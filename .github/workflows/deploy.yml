          NODE
          }
          assert_disabled_version() {
            local expected_version="$1"
            local expected_tag="$2"
            local expected_secret_state="$3"
            local active
            local capability
            local queue_state
            local secret_state
            local tagged
            active="$(active_version)" || return 1
            if [[ "$active" != "$expected_version" ]]; then
              echo "The active GitHub sync Worker changed during disabled verification." >&2
              return 1
            fi
            tagged="$(tagged_current_version "$active" "$expected_tag")" || return 1
            if [[ -z "$tagged" || "$tagged" != "$active" ]]; then
              echo "The disabled GitHub sync Worker is not exactly this run's tagged version." >&2
              return 1
            fi
            capability="$(
              version_has_exact_disabled_github_contract \
                "$active" "$expected_secret_state"
            )" || return 1
            if [[ "$capability" != "compatible" ]]; then
              echo "The disabled GitHub sync Worker does not have the exact three-Workflow contract." >&2
              return 1
            fi
            queue_state="$(github_sync_queue_state)" || return 1
            if [[ "$queue_state" != "clear" ]]; then
              echo "The disabled GitHub sync Worker still has a Queue association." >&2
              return 1
            fi
            secret_state="$(github_sync_secret_state)" || return 1
            if [[ "$secret_state" != "$expected_secret_state" ]]; then
              echo "The GitHub sync credential binding changed during disabled verification." >&2
              return 1
            fi
          }
          initial_secret_state="$(github_sync_secret_state)"
          pnpm exec wrangler deploy --strict \
            --tag "$quiesce_tag" \
            --config "$config"
          quiesced_version="$(active_version)"
          tagged_current_version "$quiesced_version" "$quiesce_tag" > /dev/null
          assert_disabled_version "$quiesced_version" "$quiesce_tag" "$initial_secret_state"

          github_sync_schedule_state() {
            node --input-type=module <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!accountId || !token) {
            throw new Error("Cloudflare schedule verification inputs are incomplete.");
          }
          const response = await fetch(
            `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(accountId)}` +
              "/workers/scripts/edgemneme-github-sync/schedules",
            { headers: { Authorization: `Bearer ${token}` }, redirect: "manual" }
          );
          if (!response.ok) {
            throw new Error(`Cloudflare schedule query failed with HTTP ${response.status}.`);
          }
          const envelope = await response.json();
          if (envelope?.success !== true || !Array.isArray(envelope?.result?.schedules)) {
            throw new Error("The Cloudflare schedule response is invalid.");
          }
          const schedules = envelope.result.schedules;
          if (schedules.length === 0) {
            process.stdout.write("clear");
          } else if (schedules.length === 1 && schedules[0]?.cron === "0 */6 * * *") {
            process.stdout.write("pending");
          } else {
            throw new Error("The GitHub sync Worker has an unrecognized Cron Trigger state.");
          }
          NODE
          }

          remove_github_sync_secret_with_tag() {
            local tag="$1"
            VERSION_TAG="$tag" node --input-type=module <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const tag = process.env.VERSION_TAG;
          if (!accountId || !token || !tag) {
            throw new Error("Cloudflare tagged secret deletion inputs are incomplete.");
          }
          const body = {
            secrets: { GITHUB_CLASSIC_TOKEN: null },
            version_tags: { "workers/tag": tag }
          };
          const response = await fetch(
            `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(accountId)}` +
              "/workers/scripts/edgemneme-github-sync/secrets-bulk",
            {
              method: "PATCH",
              headers: {
                Authorization: `Bearer ${token}`,
                "Content-Type": "application/json"
              },
              body: JSON.stringify(body),
              redirect: "manual"
            }
          );
          if (!response.ok) {
            throw new Error(
              `Cloudflare tagged secret deletion failed with HTTP ${response.status}.`
            );
          }
          const envelope = await response.json();
          const result = envelope?.result;
          if (
            envelope?.success !== true ||
            typeof result !== "object" || result === null || Array.isArray(result) ||
            Object.keys(result).length !== 0
          ) {
            throw new Error("The tagged GitHub sync secret deletion response is invalid.");
          }
          NODE
          }

          cloudflare_github_workflow_state() {
            ALLOW_MISSING_WORKFLOWS="false" node --input-type=module <<'NODE'
          const workflowContracts = [
            {
              name: "edgemneme-github-dispatch-workflow",
              className: "GitHubDispatchWorkflow"
            },
            {
              name: "edgemneme-github-ref-sync-workflow",
              className: "GitHubRefSyncWorkflow"
            },
            {
              name: "edgemneme-github-retention-workflow",
              className: "GitHubRetentionWorkflow"
            }
          ];
          const nonterminalStatuses = [
            "queued",
            "running",
            "paused",
            "waitingForPause",
            "waiting",
            "rollingBack"
          ];
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const allowMissing = process.env.ALLOW_MISSING_WORKFLOWS === "true";
          if (!accountId || !token || process.env.ALLOW_MISSING_WORKFLOWS !== "false") {
            throw new Error("Cloudflare Workflow lifecycle inputs are invalid.");
          }
          const base = `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(accountId)}`;
          const headers = { Authorization: `Bearer ${token}` };
          const request = async (url, allowNotFound = false) => {
            const response = await fetch(url, { headers, redirect: "manual" });
            if (allowNotFound && response.status === 404) return null;
            if (!response.ok) {
              throw new Error(`Cloudflare Workflow query failed with HTTP ${response.status}.`);
            }
            const envelope = await response.json();
            if (envelope?.success !== true) {
              throw new Error("The Cloudflare Workflow response is invalid.");
            }
            return envelope;
          };
          const expectedInventory = new Map(
            workflowContracts.map((contract) => [contract.name, contract.className])
          );
          const workflowInventoryNames = new Set();
          const accountWorkflowIds = new Set();
          const accountWorkflowNames = new Set();
          let inventoryTotalCount;
          let inventoryTotalPages;
          for (let page = 1; page <= 10_000; page += 1) {
            const url = new URL(`${base}/workflows`);
            url.searchParams.set("page", String(page));
            url.searchParams.set("per_page", "100");
            const envelope = await request(url);
            const info = envelope?.result_info;
            if (
              !Array.isArray(envelope.result) ||
              !Number.isSafeInteger(info?.count) || info.count !== envelope.result.length ||
              !Number.isSafeInteger(info?.page) || info.page !== page ||
              !Number.isSafeInteger(info?.per_page) || info.per_page !== 100 ||
              !Number.isSafeInteger(info?.total_count) || info.total_count < 0 ||
              !Number.isSafeInteger(info?.total_pages) || info.total_pages < 0 ||
              (info.total_count > 0 &&
                info.total_pages !== Math.ceil(info.total_count / info.per_page)) ||
              (info.total_count === 0 && ![0, 1].includes(info.total_pages))
            ) {
              throw new Error("The Cloudflare Workflow inventory pagination is invalid.");
            }
            inventoryTotalCount ??= info.total_count;
            inventoryTotalPages ??= info.total_pages;
            if (
              info.total_count !== inventoryTotalCount ||
              info.total_pages !== inventoryTotalPages
            ) {
              throw new Error("The Cloudflare Workflow inventory changed during pagination.");
            }
            for (const workflow of envelope.result) {
              if (
                typeof workflow?.id !== "string" || workflow.id.length === 0 ||
                typeof workflow?.name !== "string" || workflow.name.length === 0 ||
                typeof workflow?.script_name !== "string" || workflow.script_name.length === 0 ||
                accountWorkflowIds.has(workflow.id) || accountWorkflowNames.has(workflow.name)
              ) {
                throw new Error("The Cloudflare Workflow inventory contains an invalid entry.");
              }
              accountWorkflowIds.add(workflow.id);
              accountWorkflowNames.add(workflow.name);
              if (workflow.script_name !== "edgemneme-github-sync") continue;
              const expectedClass = expectedInventory.get(workflow.name);
              if (
                expectedClass === undefined || workflow.class_name !== expectedClass ||
                (workflow.schedules !== undefined &&
                  (!Array.isArray(workflow.schedules) || workflow.schedules.length !== 0))
              ) {
                throw new Error("The GitHub sync Workflow inventory is not the exact approved set.");
              }
              workflowInventoryNames.add(workflow.name);
            }
            const finalPage = Math.max(1, inventoryTotalPages);
            if (page >= finalPage) break;
            if (page === 10_000) {
              throw new Error("Cloudflare Workflow inventory pagination exceeded its safety bound.");
            }
          }
          if (
            accountWorkflowIds.size !== inventoryTotalCount ||
            workflowInventoryNames.size !== expectedInventory.size ||
            [...expectedInventory.keys()].some((name) => !workflowInventoryNames.has(name))
          ) {
            throw new Error("The GitHub sync Workflow inventory is not the exact approved set.");
          }
          let pendingInstances = 0;
          const observedInstanceKeys = new Set();
          const statusInstanceKeys = new Set();
          for (const contract of workflowContracts) {
            const definitionEnvelope = await request(
              `${base}/workflows/${encodeURIComponent(contract.name)}`,
              allowMissing
            );
            if (definitionEnvelope === null) continue;
            const workflow = definitionEnvelope.result;
            if (
              workflow?.name !== contract.name ||
              workflow?.class_name !== contract.className ||
              workflow?.script_name !== "edgemneme-github-sync" ||
              (workflow?.schedules !== undefined &&
                (!Array.isArray(workflow.schedules) || workflow.schedules.length !== 0))
            ) {
              throw new Error("A GitHub sync Workflow definition does not match the approved contract.");
            }
            for (const status of nonterminalStatuses) {
              let cursor;
              const observedCursors = new Set();
              for (let page = 0; page < 10_000; page += 1) {
                const url = new URL(
                  `${base}/workflows/${encodeURIComponent(contract.name)}/instances`
                );
                url.searchParams.set("status", status);
                url.searchParams.set("direction", "asc");
                url.searchParams.set("per_page", "100");
                if (cursor !== undefined) url.searchParams.set("cursor", cursor);
                const envelope = await request(url);
                if (!Array.isArray(envelope.result)) {
                  throw new Error("The Cloudflare Workflow instance page is invalid.");
                }
                for (const instance of envelope.result) {
                  const observedInstanceKey = JSON.stringify([contract.name, instance?.id]);
                  const statusInstanceKey = JSON.stringify([
                    contract.name, status, instance?.id
                  ]);
                  if (
                    typeof instance?.id !== "string" ||
                    instance.id.length === 0 ||
                    instance.status !== status ||
                    statusInstanceKeys.has(statusInstanceKey)
                  ) {
                    throw new Error("A Cloudflare Workflow instance is invalid or duplicated.");
                  }
                  statusInstanceKeys.add(statusInstanceKey);
                  if (!observedInstanceKeys.has(observedInstanceKey)) {
                    observedInstanceKeys.add(observedInstanceKey);
                    pendingInstances += 1;
                  }
                }
                const nextCursor = envelope?.result_info?.cursor;
                if (nextCursor === undefined || nextCursor === null || nextCursor === "") break;
                if (typeof nextCursor !== "string" || observedCursors.has(nextCursor)) {
                  throw new Error("A Cloudflare Workflow instance cursor is invalid or repeated.");
                }
                observedCursors.add(nextCursor);
                cursor = nextCursor;
                if (page === 9_999) {
                  throw new Error("Cloudflare Workflow instance pagination exceeded its safety bound.");
                }
              }
            }
          }
          process.stdout.write(pendingInstances === 0 ? "clear" : "pending");
          NODE
          }

          github_sync_d1_state() {
            local schema
            local table_names
            local count_expression="0"
            local output
            schema="$(
              pnpm exec wrangler d1 execute MEMORY_DB --remote --json \
                --config "$config" \
                --command "SELECT name FROM sqlite_master WHERE type = 'table' AND name IN ('github_sync_dispatches', 'github_sync_dispatch_items', 'github_repository_sync_runs', 'github_credential_sync_lane') ORDER BY name;"
            )" || return 1
            table_names="$(D1_RESULT_JSON="$schema" node --input-type=module <<'NODE'
          const statements = JSON.parse(process.env.D1_RESULT_JSON ?? "");
          const rows = statements?.[0]?.results;
          if (statements?.length !== 1 || statements[0]?.success !== true || !Array.isArray(rows)) {
            throw new Error("The GitHub sync D1 schema probe response is invalid.");
          }
          const allowed = new Set([
            "github_sync_dispatches",
            "github_sync_dispatch_items",
            "github_repository_sync_runs",
            "github_credential_sync_lane"
          ]);
          const names = rows.map((row) => row?.name);
          if (names.some((name) => typeof name !== "string" || !allowed.has(name)) ||
              new Set(names).size !== names.length) {
            throw new Error("The GitHub sync D1 schema probe contains an unexpected table.");
          }
          process.stdout.write(`|${names.join("|")}|`);
          NODE
            )" || return 1
            if [[ "$table_names" == *"|github_sync_dispatches|"* ]]; then
              count_expression+=" + (SELECT COUNT(*) FROM github_sync_dispatches WHERE status IN ('materialized', 'dispatching'))"
            fi
            if [[ "$table_names" == *"|github_sync_dispatch_items|"* ]]; then
              count_expression+=" + (SELECT COUNT(*) FROM github_sync_dispatch_items WHERE status IN ('pending', 'running'))"
            fi
            if [[ "$table_names" == *"|github_repository_sync_runs|"* ]]; then
              count_expression+=" + (SELECT COUNT(*) FROM github_repository_sync_runs WHERE status = 'running')"
            fi
            if [[ "$table_names" == *"|github_credential_sync_lane|"* ]]; then
              count_expression+=" + (SELECT COUNT(*) FROM github_credential_sync_lane WHERE holder_id IS NOT NULL OR lease_claim_id IS NOT NULL OR lease_until IS NOT NULL)"
            fi
            output="$(
              pnpm exec wrangler d1 execute MEMORY_DB --remote --json \
                --config "$config" --command "SELECT $count_expression AS count;"
            )" || return 1
            D1_RESULT_JSON="$output" node --input-type=module <<'NODE'
          const statements = JSON.parse(process.env.D1_RESULT_JSON ?? "");
          const count = statements?.[0]?.results?.[0]?.count;
          if (statements?.length !== 1 || statements[0]?.success !== true ||
              !Number.isSafeInteger(count) || count < 0) {
            throw new Error("The GitHub sync D1 drain response is invalid.");
          }
          process.stdout.write(count === 0 ? "clear" : "pending");
          NODE
          }

          github_sync_zero_observation() {
            local d1_state
            local reconciliation_state
            local schedule_state
            local verified_schedule_state
            local verified_workflow_state
            local workflow_state
            assert_disabled_version \
              "$quiesced_version" "$quiesce_tag" "$initial_secret_state" || return 1
            workflow_state="$(cloudflare_github_workflow_state)" || return 1
            schedule_state="$(github_sync_schedule_state)" || return 1
            if [[ "$schedule_state" != "clear" || "$workflow_state" != "clear" ]]; then
              printf '%s' "pending"
              return 0
            fi
            reconciliation_state="$(
              node scripts/github-sync-quiescence.mjs reconcile \
                --config "$config" \
                --disabled-version "$quiesced_version" \
                --schedule-state clear \
                --workflow-state clear
            )" || return 1
            case "$reconciliation_state" in
              clear|pending) ;;
              *)
                echo "GitHub sync D1 reconciliation returned an invalid state." >&2
                return 1
                ;;
            esac
            verified_schedule_state="$(github_sync_schedule_state)" || return 1
            verified_workflow_state="$(cloudflare_github_workflow_state)" || return 1
            assert_disabled_version \
              "$quiesced_version" "$quiesce_tag" "$initial_secret_state" || return 1
            if [[ "$verified_schedule_state" != "clear" || \
                  "$verified_workflow_state" != "clear" ]]; then
              echo "GitHub sync control-plane state changed during D1 reconciliation." >&2
              return 1
            fi
            if [[ "$reconciliation_state" == "pending" ]]; then
              printf '%s' "pending"
              return 0
            fi
            d1_state="$(github_sync_d1_state)" || return 1
            if [[ "$schedule_state" == "clear" && \
                  "$verified_schedule_state" == "clear" && \
                  "$workflow_state" == "clear" && \
                  "$verified_workflow_state" == "clear" && \
                  "$reconciliation_state" == "clear" && \
                  "$d1_state" == "clear" ]]; then
              printf '%s' "clear"
            else
              printf '%s' "pending"
            fi
          }

          wait_for_github_sync_drain() {
            local observation_state
            local zero_observations=0
            for ((attempt = 1; attempt <= 30; attempt++)); do
              observation_state="$(github_sync_zero_observation)" || return 1
              if [[ "$observation_state" == "clear" ]]; then
                zero_observations=$((zero_observations + 1))
                if (( zero_observations == 2 )); then
                  return 0
                fi
              else
                zero_observations=0
              fi
              if (( attempt < 30 )); then
                sleep 60
              fi
            done
            echo "GitHub sync did not reach two consecutive quiescent observations; the credential is retained." >&2
            return 1
          }

          wait_for_github_sync_drain
          final_observation_state="$(github_sync_zero_observation)"
          if [[ "$final_observation_state" != "clear" ]]; then
            echo "The final GitHub sync drain fence is not clear; the credential is retained." >&2
            exit 1
          fi
          assert_disabled_version \
            "$quiesced_version" "$quiesce_tag" "$initial_secret_state"
          if [[ "$initial_secret_state" == "present" ]]; then
            remove_github_sync_secret_with_tag "$secretless_tag"
          else
            secretless_tag="$quiesce_tag"
          fi
          secretless_version="$(active_version)"
          tagged_current_version "$secretless_version" "$secretless_tag" > /dev/null
          secretless_capability="$(
            version_has_exact_disabled_github_contract "$secretless_version" "absent"
          )"
          if [[ "$secretless_capability" != "compatible" ]]; then
            echo "The secretless GitHub sync version is not the exact disabled three-Workflow contract." >&2
            exit 1
          fi
          assert_disabled_version "$secretless_version" "$secretless_tag" "absent"
          secrets="$(pnpm exec wrangler secret list --config "$config" --format json)"
          schedules_state="$(github_sync_schedule_state)"
          workflow_state="$(cloudflare_github_workflow_state)"
          d1_state="$(github_sync_d1_state)"
          if [[ "$workflow_state" != "clear" || "$d1_state" != "clear" ]]; then
            echo "GitHub sync work appeared after credential deletion." >&2
            exit 1
          fi
          SECRETS_JSON="$secrets" SCHEDULES_STATE="$schedules_state" node --input-type=module <<'NODE'
          const secrets = JSON.parse(process.env.SECRETS_JSON ?? "");
          if (!Array.isArray(secrets) || process.env.SCHEDULES_STATE !== "clear") {
            throw new Error("GitHub sync lifecycle verification output is invalid.");
          }
          if (secrets.length !== 0) {
            throw new Error("Disabled GitHub sync retained an unexpected secret binding.");
          }
          NODE
          assert_disabled_version "$secretless_version" "$secretless_tag" "absent"

      - name: Revalidate orchestrator deployment main
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-github-main-head.mjs

      - name: Revalidate orchestrator deployment state
        timeout-minutes: 2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_ORCHESTRATOR_VERSION: ${{ needs.capture_production_state.outputs.orchestrator_previous_version }}
        run: node scripts/capture-deployment-state.mjs verify orchestrator_version

      - name: Deploy memory orchestrator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm exec wrangler deploy --strict
          --tag "edgemneme-ledger-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-orchestrator"
          --config wrangler/.wrangler/memory-orchestrator.generated.jsonc

      - name: Rebuild and verify projections
        timeout-minutes: 65
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm projection:rebuild:enqueue --resume --max-wait-seconds 3600
          pnpm projection:rebuild:verify --wait-seconds 3600

      - name: Create ephemeral gateway secret file
        env:
          TOKEN_DIGEST_PEPPER: ${{ secrets.TOKEN_DIGEST_PEPPER }}
          PAGE_TOKEN_HMAC_KEY: ${{ secrets.PAGE_TOKEN_HMAC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from "node:fs";

          const directory = "wrangler/.wrangler";
          mkdirSync(directory, { recursive: true, mode: 0o700 });
          const entries = ["TOKEN_DIGEST_PEPPER", "PAGE_TOKEN_HMAC_KEY"].map((name) => {
            const value = process.env[name];
            if (!value) {
              throw new Error(`Required Worker secret ${name} is missing.`);
            }
            return [name, value];
          });
          writeFileSync(
            `${directory}/memory-gateway.secrets.json`,
            `${JSON.stringify(Object.fromEntries(entries))}\n`,
            { mode: 0o600 }
          );
          NODE

      - name: Revalidate gateway deployment main
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-github-main-head.mjs

      - name: Revalidate gateway deployment state
        timeout-minutes: 2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_GATEWAY_VERSION: ${{ needs.capture_production_state.outputs.gateway_previous_version }}
          EXPECTED_GATEWAY_TRIGGER_STATE: ${{ needs.capture_production_state.outputs.gateway_previous_trigger_state }}
          EXPECTED_GATEWAY_TRIGGER_FINGERPRINT: ${{ needs.capture_production_state.outputs.gateway_previous_trigger_fingerprint }}
          EDGEMNEME_BOOTSTRAP_MODE: ${{ needs.capture_production_state.outputs.bootstrap_mode }}
        run: |
          node scripts/capture-deployment-state.mjs verify \
            gateway_version \
            gateway_trigger_state \
            gateway_trigger_fingerprint
          node scripts/gateway-deployment-target.mjs verify-predeploy \
            wrangler/.wrangler/memory-gateway.generated.jsonc

      - name: Deploy memory gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm exec wrangler deploy --strict
          --tag "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-gateway"
          --config wrangler/.wrangler/memory-gateway.generated.jsonc
          --secrets-file wrangler/.wrangler/memory-gateway.secrets.json

      - name: Remove gateway secret file
        if: always()
        run: rm -f -- wrangler/.wrangler/memory-gateway.secrets.json

      - name: Capture deployed gateway canary target
        id: gateway_canary_target
        timeout-minutes: 2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_GATEWAY_TRIGGER_STATE: ${{ needs.capture_production_state.outputs.gateway_previous_trigger_state }}
          EXPECTED_GATEWAY_TRIGGER_FINGERPRINT: ${{ needs.capture_production_state.outputs.gateway_previous_trigger_fingerprint }}
          EXPECTED_GATEWAY_DEPLOYMENT_TAG: github-${{ github.run_id }}-${{ github.run_attempt }}-gateway
          EDGEMNEME_BOOTSTRAP_MODE: ${{ needs.capture_production_state.outputs.bootstrap_mode }}
        run: >-
          node scripts/gateway-deployment-target.mjs capture-canary-target
          wrangler/.wrangler/memory-gateway.generated.jsonc

      - name: Run isolated production canary
        id: isolated_production_canary
        timeout-minutes: 20
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TOKEN_DIGEST_PEPPER: ${{ secrets.TOKEN_DIGEST_PEPPER }}
          EDGEMNEME_GATEWAY_URL: ${{ steps.gateway_canary_target.outputs.gateway_url }}
          EDGEMNEME_GATEWAY_EXPECTED_HOST: ${{ steps.gateway_canary_target.outputs.gateway_host }}
        run: node scripts/run-synthetic-canary.mjs

      - name: Recover isolated production canary
        # A successful canary already completed cleanup. Recovery remains fail-closed
        # because a missing project alone cannot prove Vectorize and R2 cleanup.
        if: >-
          always() &&
          steps.isolated_production_canary.outcome != 'success' &&
          steps.isolated_production_canary.outcome != 'skipped'
        timeout-minutes: 12
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${EDGEMNEME_CANARY_PROJECT_ID:-}" ]] || \
             [[ ! -f wrangler/.wrangler/memory-gateway.generated.jsonc ]]; then
            exit 0
          fi
          node scripts/run-synthetic-canary.mjs --cleanup-only

      - name: Reverify deployed gateway canary target
        if: always() && steps.gateway_canary_target.outcome == 'success'
        timeout-minutes: 2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_GATEWAY_ACTIVE_VERSION: ${{ steps.gateway_canary_target.outputs.gateway_active_version }}
          EXPECTED_GATEWAY_TRIGGER_STATE: ${{ steps.gateway_canary_target.outputs.gateway_trigger_state }}
          EXPECTED_GATEWAY_TRIGGER_FINGERPRINT: ${{ steps.gateway_canary_target.outputs.gateway_trigger_fingerprint }}
          EXPECTED_GATEWAY_DEPLOYMENT_TAG: github-${{ github.run_id }}-${{ github.run_attempt }}-gateway
        run: >-
          node scripts/gateway-deployment-target.mjs verify-canary-target
          wrangler/.wrangler/memory-gateway.generated.jsonc

      - name: Create ephemeral GitHub sync secret file
        if: vars.ENABLE_GITHUB_SYNC == 'true'
        env:
          GITHUB_CLASSIC_TOKEN: ${{ secrets.GITHUB_CLASSIC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from "node:fs";

          const token = process.env.GITHUB_CLASSIC_TOKEN;
          if (!token) {
            throw new Error("Required Worker secret GITHUB_CLASSIC_TOKEN is missing.");
          }
          const directory = "wrangler/.wrangler";
          mkdirSync(directory, { recursive: true, mode: 0o700 });
          writeFileSync(
            `${directory}/github-sync.secrets.json`,
            `${JSON.stringify({ GITHUB_CLASSIC_TOKEN: token })}\n`,
            { mode: 0o600 }
          );
          NODE

      - name: Revalidate GitHub sync deployment main
        if: vars.ENABLE_GITHUB_SYNC == 'true'
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-github-main-head.mjs

      - name: Revalidate GitHub sync deployment state
        if: vars.ENABLE_GITHUB_SYNC == 'true'
        timeout-minutes: 2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_GITHUB_SYNC_VERSION: ${{ needs.capture_production_state.outputs.github_sync_previous_version }}
          EXPECTED_GITHUB_SYNC_STATE: ${{ needs.capture_production_state.outputs.github_sync_previous_state }}
          EXPECTED_GITHUB_SYNC_SCHEDULE_STATE: ${{ needs.capture_production_state.outputs.github_sync_previous_schedule_state }}
          EXPECTED_GITHUB_SYNC_SECRET_STATE: ${{ needs.capture_production_state.outputs.github_sync_previous_secret_state }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/capture-deployment-state.mjs verify \
            github_sync_version \
            github_sync_state \
            github_sync_schedule_state \
            github_sync_secret_state

      - name: Deploy GitHub sync
        if: vars.ENABLE_GITHUB_SYNC == 'true'
        timeout-minutes: 35
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_CREDENTIAL_VERSION: ${{ vars.SYNC_CREDENTIAL_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          config="wrangler/.wrangler/github-sync.generated.jsonc"
          active_version() {
            local deployments
            deployments="$(pnpm exec wrangler deployments list --config "$config" --json)" || return 1
            DEPLOYMENTS_JSON="$deployments" node --input-type=module <<'NODE'
          const deployments = JSON.parse(process.env.DEPLOYMENTS_JSON ?? "");
          if (!Array.isArray(deployments) || deployments.length === 0) {
            throw new Error("The GitHub sync Worker has no active deployment.");
          }
          const candidates = deployments.map((deployment) => {
            const createdAt = Date.parse(deployment?.created_on);
            if (!Number.isFinite(createdAt)) {
              throw new Error("A GitHub sync deployment has an invalid creation timestamp.");
            }
            return { deployment, createdAt };
          });
          const latest = candidates.reduce((selected, candidate) =>
            candidate.createdAt > selected.createdAt ? candidate : selected
          ).deployment;
          if (
            !Array.isArray(latest.versions) ||
            latest.versions.length !== 1 ||
            typeof latest.versions[0]?.version_id !== "string" ||
            !/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(
              latest.versions[0].version_id
            ) ||
            latest.versions[0]?.percentage !== 100
          ) {
            throw new Error("The active GitHub sync deployment is not a single 100% version.");
          }
          process.stdout.write(latest.versions[0].version_id);
          NODE
          }
          tagged_current_version() {
            local version_id="$1"
            local expected_tag="$2"
            local version
            version="$(
              pnpm exec wrangler versions view "$version_id" --config "$config" --json
            )" || return 1
            VERSION_JSON="$version" VERSION_ID="$version_id" EXPECTED_TAG="$expected_tag" \
              node --input-type=module <<'NODE'
          const version = JSON.parse(process.env.VERSION_JSON ?? "");
          if (
            typeof version !== "object" || version === null || Array.isArray(version) ||
            !process.env.VERSION_ID || !process.env.EXPECTED_TAG ||
            version.id !== process.env.VERSION_ID
          ) {
            throw new Error("The GitHub sync Worker version metadata is invalid.");
          }
          process.stdout.write(
            version.annotations?.["workers/tag"] === process.env.EXPECTED_TAG ? version.id : ""
          );
          NODE
          }
          version_has_exact_enabled_github_contract() {
            local version_id="$1"
            VERSION_ID="$version_id" node --input-type=module <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const versionId = process.env.VERSION_ID;
          const credentialVersion = process.env.GITHUB_CREDENTIAL_VERSION;
          if (!accountId || !token || !versionId || !credentialVersion) {
            throw new Error("The enabled GitHub sync version inputs are invalid.");
          }
          const response = await fetch(
            `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(accountId)}` +
              `/workers/scripts/edgemneme-github-sync/versions/${encodeURIComponent(versionId)}`,
            { headers: { Authorization: `Bearer ${token}` }, redirect: "manual" }
          );
          if (!response.ok) {
            throw new Error(
              `Cloudflare enabled GitHub sync version query failed with HTTP ${response.status}.`
            );
          }
          const envelope = await response.json();
          const result = envelope?.result;
          const bindings = result?.resources?.bindings;
          if (
            envelope?.success !== true || result?.id !== versionId || !Array.isArray(bindings)
          ) {
            throw new Error("The enabled GitHub sync version response is invalid.");
          }
          const expected = new Map([
            ["GITHUB_DISPATCH_WORKFLOW", [
              "edgemneme-github-dispatch-workflow", "GitHubDispatchWorkflow"
            ]],
            ["GITHUB_REF_SYNC_WORKFLOW", [
              "edgemneme-github-ref-sync-workflow", "GitHubRefSyncWorkflow"
            ]],
            ["GITHUB_RETENTION_WORKFLOW", [
              "edgemneme-github-retention-workflow", "GitHubRetentionWorkflow"
            ]]
          ]);
          const workflows = bindings.filter((binding) => binding?.type === "workflow");
          const runtime = bindings.filter(
            (binding) => binding?.type === "plain_text" && binding?.name === "GITHUB_SYNC_ENABLED"
          );
          const credential = bindings.filter(
            (binding) => binding?.type === "plain_text" &&
              binding?.name === "GITHUB_CREDENTIAL_VERSION"
          );
          const secrets = bindings.filter(
            (binding) => binding?.type === "secret_text" || binding?.type === "secret_key"
          );
          const compatible =
            !bindings.some((binding) => binding?.type === "queue") &&
            secrets.length === 1 && secrets[0]?.type === "secret_text" &&
            secrets[0]?.name === "GITHUB_CLASSIC_TOKEN" &&
            runtime.length === 1 && runtime[0]?.text === "true" &&
            credential.length === 1 && credential[0]?.text === credentialVersion &&
            workflows.length === expected.size &&
            workflows.every((binding) => {
              const contract = expected.get(binding?.name);
              return contract !== undefined &&
                binding.workflow_name === contract[0] &&
                binding.class_name === contract[1] &&
                (binding.script_name === undefined ||
                  binding.script_name === "edgemneme-github-sync");
            }) &&
            new Set(workflows.map((binding) => binding.name)).size === expected.size;
          process.stdout.write(compatible ? "compatible" : "incompatible");
          NODE
          }
          github_sync_queue_state() {
            node --input-type=module <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!accountId || !token) {
            throw new Error("Cloudflare Queue lifecycle inputs are incomplete.");
          }
          const base = `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(accountId)}`;
          const headers = { Authorization: `Bearer ${token}` };
          const request = async (url) => {
            const response = await fetch(url, { headers, redirect: "manual" });
            if (!response.ok) {
              throw new Error(`Cloudflare Queue query failed with HTTP ${response.status}.`);
            }
            const envelope = await response.json();
            if (envelope?.success !== true) {
              throw new Error("The Cloudflare Queue response is invalid.");
            }
            return envelope;
          };
          const queueIds = new Set();
          let totalCount;
          let totalPages;
          for (let page = 1; page <= 10_000; page += 1) {
            const url = new URL(`${base}/queues`);
            url.searchParams.set("page", String(page));
            url.searchParams.set("per_page", "100");
            const envelope = await request(url);
            const info = envelope?.result_info;
            if (
              !Array.isArray(envelope.result) ||
              !Number.isSafeInteger(info?.count) || info.count !== envelope.result.length ||
              !Number.isSafeInteger(info?.page) || info.page !== page ||
              !Number.isSafeInteger(info?.per_page) || info.per_page < 1 ||
              info.count > info.per_page ||
              !Number.isSafeInteger(info?.total_count) || info.total_count < 0 ||
              !Number.isSafeInteger(info?.total_pages) || info.total_pages < 0 ||
              (info.total_count > 0 &&
                info.total_pages !== Math.ceil(info.total_count / info.per_page)) ||
              (info.total_count === 0 && ![0, 1].includes(info.total_pages))
            ) {
              throw new Error("The Cloudflare Queue inventory pagination is invalid.");
            }
            totalCount ??= info.total_count;
            totalPages ??= info.total_pages;
            if (info.total_count !== totalCount || info.total_pages !== totalPages) {
              throw new Error("The Cloudflare Queue inventory changed during pagination.");
            }
            for (const queue of envelope.result) {
              if (
                typeof queue?.queue_id !== "string" || queue.queue_id.length === 0 ||
                typeof queue?.queue_name !== "string" || queue.queue_name.length === 0 ||
                queueIds.has(queue.queue_id) ||
                !Number.isSafeInteger(queue?.consumers_total_count) ||
                queue.consumers_total_count < 0 ||
                !Number.isSafeInteger(queue?.producers_total_count) ||
                queue.producers_total_count < 0 ||
                (queue.consumers !== undefined && !Array.isArray(queue.consumers)) ||
                (queue.producers !== undefined && !Array.isArray(queue.producers))
              ) {
                throw new Error("The Cloudflare Queue inventory contains an invalid entry.");
              }
              queueIds.add(queue.queue_id);
              let consumers = queue.consumers ?? [];
              if (consumers.length > queue.consumers_total_count) {
                throw new Error("A Cloudflare Queue consumer count is invalid.");
              }
              if (consumers.length !== queue.consumers_total_count) {
                const consumerEnvelope = await request(
                  `${base}/queues/${encodeURIComponent(queue.queue_id)}/consumers`
                );
                if (
                  !Array.isArray(consumerEnvelope.result) ||
                  consumerEnvelope.result.length !== queue.consumers_total_count
                ) {
                  throw new Error("A Cloudflare Queue consumer inventory is incomplete.");
                }
                consumers = consumerEnvelope.result;
              }
              const producers = queue.producers ?? [];
              if (producers.length !== queue.producers_total_count) {
                throw new Error("A Cloudflare Queue producer inventory is incomplete.");
              }
              const consumerIds = new Set();
              for (const consumer of consumers) {
                const workerScripts = [consumer?.script, consumer?.service, consumer?.script_name]
                  .filter((value) => value !== undefined && value !== null);
                const validWorkerScript = (value) =>
                  typeof value === "string" &&
                  value.length > 0 &&
                  value.length <= 512 &&
                  value.trim() === value &&
                  !/[\u0000-\u001f\u007f]/u.test(value);
                const workerScript =
                  workerScripts.length > 0 &&
                  workerScripts.every(validWorkerScript) &&
                  new Set(workerScripts).size === 1
                    ? workerScripts[0]
                    : null;
                if (
                  typeof consumer?.consumer_id !== "string" ||
                  consumer.consumer_id.length === 0 ||
                  consumerIds.has(consumer.consumer_id) ||
                  !["worker", "http_pull"].includes(consumer?.type) ||
                  (consumer.type === "worker" && workerScript === null)
                ) {
                  throw new Error("A Cloudflare Queue consumer entry is invalid.");
                }
                consumerIds.add(consumer.consumer_id);
                if (workerScript === "edgemneme-github-sync") {
                  throw new Error("The GitHub sync Worker still has a Queue consumer.");
                }
              }
              for (const producer of producers) {
                if (
                  (producer?.type !== "worker" && producer?.type !== "r2_bucket") ||
                  (producer.type === "worker" &&
                    (typeof producer.script !== "string" || producer.script.length === 0)) ||
                  (producer.type === "r2_bucket" &&
                    (typeof producer.bucket_name !== "string" || producer.bucket_name.length === 0))
                ) {
                  throw new Error("A Cloudflare Queue producer entry is invalid.");
                }
                if (producer?.script === "edgemneme-github-sync") {
                  throw new Error("The GitHub sync Worker still has a Queue producer.");
                }
              }
            }
            if (page >= Math.max(1, totalPages)) break;
            if (page === 10_000) {
              throw new Error("Cloudflare Queue inventory pagination exceeded its safety bound.");
            }
          }
          if (queueIds.size !== totalCount) {
            throw new Error("The Cloudflare Queue inventory count is inconsistent.");
          }
          process.stdout.write("clear");
          NODE
          }
          assert_active_tagged_version() {
            local expected_version="$1"
            local expected_tag="$2"
            local active
            local capability
            local queue_state
            local tagged
            active="$(active_version)" || return 1
            if [[ "$active" != "$expected_version" ]]; then
              echo "The active GitHub sync Worker changed during enabled verification." >&2
              return 1
            fi
            tagged="$(tagged_current_version "$active" "$expected_tag")" || return 1
            if [[ -z "$tagged" || "$tagged" != "$active" ]]; then
              echo "The active GitHub sync Worker is not exactly this run's tagged version." >&2
              return 1
            fi
            capability="$(version_has_exact_enabled_github_contract "$active")" || return 1
            if [[ "$capability" != "compatible" ]]; then
              echo "The enabled GitHub sync Worker does not have the exact remote binding contract." >&2
              return 1
            fi
            queue_state="$(github_sync_queue_state)" || return 1
            if [[ "$queue_state" != "clear" ]]; then
              echo "The enabled GitHub sync Worker still has a Queue association." >&2
              return 1
            fi
          }
          expected_tag="edgemneme-github-workflows-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-enabled"
          pnpm exec wrangler deploy --strict \
            --tag "$expected_tag" \
            --config "$config" \
            --secrets-file wrangler/.wrangler/github-sync.secrets.json
          deployed_version="$(active_version)"
          assert_active_tagged_version "$deployed_version" "$expected_tag"
          secrets="$(pnpm exec wrangler secret list --config "$config" --format json)"
          schedules="$(node --input-type=module <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!accountId || !token) {
            throw new Error("Cloudflare schedule verification inputs are incomplete.");
          }
          const response = await fetch(
            `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(accountId)}` +
              "/workers/scripts/edgemneme-github-sync/schedules",
            { headers: { Authorization: `Bearer ${token}` }, redirect: "manual" }
          );
          if (!response.ok) {
            throw new Error(`Cloudflare schedule query failed with HTTP ${response.status}.`);
          }
          const envelope = await response.json();
          if (envelope?.success !== true || !Array.isArray(envelope?.result?.schedules)) {
            throw new Error("The Cloudflare schedule response is invalid.");
          }
          process.stdout.write(JSON.stringify(envelope.result.schedules));
          NODE
          )"
          node --input-type=module <<'NODE'
          const workflowContracts = [
            ["edgemneme-github-dispatch-workflow", "GitHubDispatchWorkflow"],
            ["edgemneme-github-ref-sync-workflow", "GitHubRefSyncWorkflow"],
            ["edgemneme-github-retention-workflow", "GitHubRetentionWorkflow"]
          ];
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!accountId || !token) {
            throw new Error("Cloudflare Workflow verification inputs are incomplete.");
          }
          const base = `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(accountId)}`;
          const headers = { Authorization: `Bearer ${token}` };
          const request = async (url) => {
            const response = await fetch(url, { headers, redirect: "manual" });
            if (!response.ok) {
              throw new Error(`Cloudflare Workflow verification failed with HTTP ${response.status}.`);
            }
            const envelope = await response.json();
            if (envelope?.success !== true) {
              throw new Error("The Cloudflare Workflow verification response is invalid.");
            }
            return envelope;
          };
          const expectedInventory = new Map(workflowContracts);
          const workflowInventoryNames = new Set();
          const accountWorkflowIds = new Set();
          const accountWorkflowNames = new Set();
          let inventoryTotalCount;
          let inventoryTotalPages;
          for (let page = 1; page <= 10_000; page += 1) {
            const url = new URL(`${base}/workflows`);
            url.searchParams.set("page", String(page));
            url.searchParams.set("per_page", "100");
            const envelope = await request(url);
            const info = envelope?.result_info;
            if (
              !Array.isArray(envelope.result) ||
              !Number.isSafeInteger(info?.count) || info.count !== envelope.result.length ||
              !Number.isSafeInteger(info?.page) || info.page !== page ||
              !Number.isSafeInteger(info?.per_page) || info.per_page !== 100 ||
              !Number.isSafeInteger(info?.total_count) || info.total_count < 0 ||
              !Number.isSafeInteger(info?.total_pages) || info.total_pages < 0 ||
              (info.total_count > 0 &&
                info.total_pages !== Math.ceil(info.total_count / info.per_page)) ||
              (info.total_count === 0 && ![0, 1].includes(info.total_pages))
            ) {
              throw new Error("The Cloudflare Workflow inventory pagination is invalid.");
            }
            inventoryTotalCount ??= info.total_count;
            inventoryTotalPages ??= info.total_pages;
            if (
              info.total_count !== inventoryTotalCount ||
              info.total_pages !== inventoryTotalPages
            ) {
              throw new Error("The Cloudflare Workflow inventory changed during pagination.");
            }
            for (const workflow of envelope.result) {
              if (
                typeof workflow?.id !== "string" || workflow.id.length === 0 ||
                typeof workflow?.name !== "string" || workflow.name.length === 0 ||
                typeof workflow?.script_name !== "string" || workflow.script_name.length === 0 ||
                accountWorkflowIds.has(workflow.id) || accountWorkflowNames.has(workflow.name)
              ) {
                throw new Error("The Cloudflare Workflow inventory contains an invalid entry.");
              }
              accountWorkflowIds.add(workflow.id);
              accountWorkflowNames.add(workflow.name);
              if (workflow.script_name !== "edgemneme-github-sync") continue;
              const expectedClass = expectedInventory.get(workflow.name);
              if (
                expectedClass === undefined || workflow.class_name !== expectedClass ||
                (workflow.schedules !== undefined &&
                  (!Array.isArray(workflow.schedules) || workflow.schedules.length !== 0))
              ) {
                throw new Error("The GitHub sync Workflow inventory is not the exact approved set.");
              }
              workflowInventoryNames.add(workflow.name);
            }
            if (page >= Math.max(1, inventoryTotalPages)) break;
            if (page === 10_000) {
              throw new Error("Cloudflare Workflow inventory pagination exceeded its safety bound.");
            }
          }
          if (
            accountWorkflowIds.size !== inventoryTotalCount ||
            workflowInventoryNames.size !== expectedInventory.size ||
            [...expectedInventory.keys()].some((name) => !workflowInventoryNames.has(name))
          ) {
            throw new Error("The GitHub sync Workflow inventory is not the exact approved set.");
          }
          for (const [name, className] of workflowContracts) {
            const envelope = await request(`${base}/workflows/${encodeURIComponent(name)}`);
            const workflow = envelope?.result;
            if (
              envelope?.success !== true ||
              workflow?.name !== name ||
              workflow?.class_name !== className ||
              workflow?.script_name !== "edgemneme-github-sync" ||
              (workflow?.schedules !== undefined &&
                (!Array.isArray(workflow.schedules) || workflow.schedules.length !== 0))
            ) {
              throw new Error("A GitHub sync Workflow definition does not match the approved contract.");
            }
          }
          NODE
          SECRETS_JSON="$secrets" SCHEDULES_JSON="$schedules" node --input-type=module <<'NODE'
          const secrets = JSON.parse(process.env.SECRETS_JSON ?? "");
          const schedules = JSON.parse(process.env.SCHEDULES_JSON ?? "");
          if (!Array.isArray(secrets) || !Array.isArray(schedules)) {
            throw new Error("GitHub sync lifecycle verification output is invalid.");
          }
          if (
            secrets.length !== 1 ||
            secrets[0]?.name !== "GITHUB_CLASSIC_TOKEN" ||
            secrets[0]?.type !== "secret_text"
          ) {
            throw new Error(
              "Enabled GitHub sync must have only the GITHUB_CLASSIC_TOKEN binding."
            );
          }
          if (schedules.length !== 1 || schedules[0]?.cron !== "0 */6 * * *") {
            throw new Error("Enabled GitHub sync must have exactly one approved Cron Trigger.");
          }
          NODE
          assert_active_tagged_version "$deployed_version" "$expected_tag"

      - name: Remove GitHub sync secret file
        if: always() && vars.ENABLE_GITHUB_SYNC == 'true'
        run: rm -f -- wrangler/.wrangler/github-sync.secrets.json

      - name: Remove ephemeral deployment files
        if: always()
        shell: bash
        run: |
          rm -f -- \
            wrangler/.wrangler/memory-orchestrator.generated.jsonc \
            wrangler/.wrangler/memory-gateway.generated.jsonc \
            wrangler/.wrangler/github-sync.generated.jsonc \
            wrangler/.wrangler/memory-gateway.secrets.json \
            wrangler/.wrangler/github-sync.secrets.json

  rollback_workers:
    name: Roll back failed Worker deployment
    needs: [capture_production_state, deploy]
    if: ${{ always() && needs.capture_production_state.result == 'success' && (needs.deploy.result == 'failure' || needs.deploy.result == 'cancelled') && needs.capture_production_state.outputs.bootstrap_mode != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-rollback
    steps:
      - name: Check out failed deployment source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install pnpm for rollback
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.18.0
          run_install: false

      - name: Set up Node.js for rollback
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify rollback configuration parity
        env:
          CF_D1_MEMORY_DATABASE_ID: ${{ vars.CF_D1_MEMORY_DATABASE_ID }}
          CF_D1_SEARCH_DATABASE_ID: ${{ vars.CF_D1_SEARCH_DATABASE_ID }}
          CF_RATE_LIMIT_NAMESPACE_EDGE: ${{ vars.CF_RATE_LIMIT_NAMESPACE_EDGE }}
