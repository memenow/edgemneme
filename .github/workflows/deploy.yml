              gateway_advanced_by_run=true
            fi
            pnpm exec wrangler rollback "$previous_version" \
              --config "$config" \
              --message "Automated rollback after failed deployment gate for GitHub run ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}." \
              --yes || return 1
            confirmed_version="$(active_version "$config")" || return 1
            if [[ "$confirmed_version" != "$previous_version" ]]; then
              echo "::error::The $label Worker did not reach its captured version after rollback." >&2
              return 1
            fi
          }
          rollback_github_sync() {
            local config="wrangler/.wrangler/github-sync.generated.jsonc"
            local previous_version="${EDGEMNEME_GITHUB_SYNC_PREVIOUS_VERSION:-}"
            local previous_state="${EDGEMNEME_GITHUB_SYNC_PREVIOUS_STATE:-}"
            local previous_schedule_state="${EDGEMNEME_GITHUB_SYNC_PREVIOUS_SCHEDULE_STATE:-}"
            local previous_secret_state="${EDGEMNEME_GITHUB_SYNC_PREVIOUS_SECRET_STATE:-}"
            local expected_tag="edgemneme-github-workflows-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-enabled"
            local quiesce_tag="edgemneme-github-workflows-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-github-sync-rollback-quiesced"
            local secretless_tag="edgemneme-github-workflows-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-github-sync-rollback-secretless"
            local presence
            local current_version
            local deployed_version
            local confirmed_version
            local quiesced_version
            local capability
            local restored_secret_state
            local workflow_state
            local secretless_version
            if [[ ! -f "$config" ]]; then
              echo "::error::The GitHub sync rollback config is unavailable." >&2
              return 1
            fi
            if [[ "$previous_state" != "present" && "$previous_state" != "absent" ]]; then
              echo "::error::The captured GitHub sync Worker state is invalid." >&2
              return 1
            fi
            if [[ "$previous_state" == "present" ]]; then
              if [[ -z "$previous_version" ]] || \
                 [[ "$previous_schedule_state" != "enabled" && "$previous_schedule_state" != "disabled" ]] || \
                 [[ "$previous_secret_state" != "present" && "$previous_secret_state" != "absent" ]]; then
                echo "::error::The captured GitHub sync lifecycle state is incomplete." >&2
                return 1
              fi
              if [[ "$previous_schedule_state" == "enabled" && "$previous_secret_state" != "present" ]]; then
                echo "::error::The captured enabled GitHub sync state had no credential binding." >&2
                return 1
              fi
            elif [[ -n "$previous_version" || "$previous_schedule_state" != "absent" || "$previous_secret_state" != "absent" ]]; then
              echo "::error::The captured expected-absent GitHub sync state is inconsistent." >&2
              return 1
            fi

            presence="$(worker_presence edgemneme-github-sync)" || return 1
            if [[ "$presence" == "absent" ]]; then
              if [[ "$previous_state" != "absent" ]]; then
                echo "::error::The GitHub sync Worker is absent outside its captured expected-absent state." >&2
                return 1
              fi
              return 0
            fi
            current_version="$(active_version "$config")" || return 1
            if [[ "$previous_state" == "present" && "$current_version" == "$previous_version" ]]; then
              return 0
            fi
            deployed_version="$(
              tagged_current_version "$config" "$current_version" "$expected_tag"
            )" || return 1
            if [[ -z "$deployed_version" || "$deployed_version" != "$current_version" ]]; then
              echo "::error::The active GitHub sync Worker is not exactly this run's Workflow-capable version; refusing mutation." >&2
              return 1
            fi
            confirmed_version="$(active_version "$config")" || return 1
            if [[ "$confirmed_version" != "$deployed_version" ]]; then
              echo "::error::The GitHub sync Worker changed during rollback verification." >&2
              return 1
            fi
            if [[ "$(github_sync_secret_state "$config")" != "present" ]]; then
              echo "::error::This run's enabled GitHub sync Worker no longer has its exact credential binding." >&2
              return 1
            fi
            capability="$(
              EDGEMNEME_GITHUB_SYNC_PREVIOUS_SCHEDULE_STATE=enabled \
                EDGEMNEME_GITHUB_SYNC_PREVIOUS_SECRET_STATE=present \
                version_has_github_workflow_capability "$config" "$deployed_version"
            )" || return 1
            if [[ "$capability" != "compatible" ]]; then
              echo "::error::This run's GitHub sync Worker no longer has the exact enabled binding contract." >&2
              return 1
            fi
            if [[ "$(github_sync_queue_state)" != "clear" ]]; then
              echo "::error::This run's GitHub sync Worker still has a Queue association." >&2
              return 1
            fi

            pnpm exec wrangler deploy --strict --tag "$quiesce_tag" --config "$config"
            quiesced_version="$(active_version "$config")" || return 1
            assert_exact_disabled_github_version \
              "$config" "$quiesced_version" "$quiesce_tag" "present" || return 1
            wait_for_github_sync_drain \
              "$config" "$quiesced_version" "$quiesce_tag" || return 1
            assert_exact_disabled_github_version \
              "$config" "$quiesced_version" "$quiesce_tag" "present" || return 1

            if [[ "$previous_state" == "absent" ]]; then
              remove_github_sync_secret_with_tag "$config" "$secretless_tag" || return 1
              secretless_version="$(active_version "$config")" || return 1
              confirmed_version="$(
                tagged_current_version \
                  "$config" "$secretless_version" "$secretless_tag"
              )" || return 1
              if [[ -z "$confirmed_version" || "$confirmed_version" != "$secretless_version" ]]; then
                echo "::error::The rollback secretless GitHub sync version cannot be proven exactly." >&2
                return 1
              fi
              capability="$(
                version_has_exact_disabled_github_contract "$secretless_version" "absent"
              )" || return 1
              if [[ "$capability" != "compatible" ]]; then
                echo "::error::The secretless GitHub sync version is not the exact disabled three-Workflow contract." >&2
                return 1
              fi
              assert_exact_disabled_github_version \
                "$config" "$secretless_version" "$secretless_tag" "absent" || return 1
              if [[ "$(github_sync_schedule_state)" != "clear" || \
                    "$(cloudflare_github_workflow_state)" != "clear" || \
                    "$(github_sync_d1_state "$config")" != "clear" ]]; then
                echo "::error::GitHub sync work appeared before expected-absent rollback deletion." >&2
                return 1
              fi
              assert_exact_disabled_github_version \
                "$config" "$secretless_version" "$secretless_tag" "absent" || return 1
              pnpm exec wrangler delete --config "$config" --force
              if [[ "$(worker_presence edgemneme-github-sync)" != "absent" ]]; then
                echo "::error::The expected-absent GitHub sync Worker still exists after deletion." >&2
                return 1
              fi
              return 0
            fi

            capability="$(
              version_has_github_workflow_capability "$config" "$previous_version"
            )" || return 1
            if [[ "$capability" != "compatible" ]]; then
              echo "::error::The previous GitHub sync version does not have the exact three-Workflow capability. The current Worker remains disabled; Manual roll-forward is required." >&2
              return 1
            fi
            assert_exact_disabled_github_version \
              "$config" "$quiesced_version" "$quiesce_tag" "present" || return 1
            pnpm exec wrangler rollback "$previous_version" \
              --config "$config" \
              --message "Automated rollback after failed deployment gate for GitHub run ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}." \
              --yes
            confirmed_version="$(active_version "$config")" || return 1
            if [[ "$confirmed_version" != "$previous_version" ]]; then
              echo "::error::The GitHub sync Worker did not restore the exact previous version." >&2
              return 1
            fi
            workflow_state="$(cloudflare_github_workflow_state)" || return 1
            if [[ "$workflow_state" != "clear" ]]; then
              echo "::error::The restored GitHub sync Workflow definitions are not quiescent." >&2
              return 1
            fi
            if [[ "$(github_sync_queue_state)" != "clear" ]]; then
              echo "::error::The restored GitHub sync Worker has a Queue association." >&2
              return 1
            fi
            restored_secret_state="$(github_sync_secret_state "$config")" || return 1
            if [[ "$restored_secret_state" != "$previous_secret_state" ]]; then
              echo "::error::The restored GitHub sync version does not have its exact captured credential state." >&2
              return 1
            fi
            restore_github_sync_schedule_state "$previous_schedule_state" || return 1
            confirmed_version="$(active_version "$config")" || return 1
            if [[ "$confirmed_version" != "$previous_version" ]]; then
              echo "::error::The GitHub sync Worker changed after lifecycle restoration." >&2
              return 1
            fi
            restored_secret_state="$(github_sync_secret_state "$config")" || return 1
            if [[ "$restored_secret_state" != "$previous_secret_state" ]]; then
              echo "::error::The GitHub sync credential state changed after lifecycle restoration." >&2
              return 1
            fi
          }
          set +e
          github_sync_status=0
          gateway_advanced_by_run=false
          gateway_restore_completed=false
          gateway_restore_current_state="${EXPECTED_GATEWAY_CURRENT_TRIGGER_STATE:-}"
          gateway_restore_current_fingerprint="${EXPECTED_GATEWAY_CURRENT_TRIGGER_FINGERPRINT:-}"
          if [[ "${EDGEMNEME_GITHUB_SYNC_ENABLED:-false}" == "true" ]]; then
            rollback_github_sync
            github_sync_status=$?
          fi
          rollback_if_advanced gateway \
            wrangler/.wrangler/memory-gateway.generated.jsonc \
            "${EDGEMNEME_GATEWAY_PREVIOUS_VERSION:-}" \
            "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-gateway" \
            edgemneme-memory-gateway \
            "${EDGEMNEME_BOOTSTRAP_MODE:-false}"
          gateway_status=$?
          if (( gateway_status == 0 )) && [[ "$gateway_restore_completed" != "true" ]]; then
            EXPECTED_GATEWAY_CURRENT_TRIGGER_STATE="$gateway_restore_current_state" \
              EXPECTED_GATEWAY_CURRENT_TRIGGER_FINGERPRINT="$gateway_restore_current_fingerprint" \
              EDGEMNEME_GATEWAY_ADVANCED_BY_RUN="$gateway_advanced_by_run" \
              EDGEMNEME_GATEWAY_ALLOW_DETACHED_ABSENT=false \
              node scripts/gateway-deployment-target.mjs restore
            gateway_status=$?
          fi
          if (( gateway_status == 0 )); then
            EXPECTED_GATEWAY_VERSION="${EDGEMNEME_GATEWAY_PREVIOUS_VERSION:-}" \
              node scripts/capture-deployment-state.mjs verify \
                gateway_version \
                gateway_trigger_state \
                gateway_trigger_fingerprint
            gateway_status=$?
          fi
          rollback_if_advanced orchestrator \
            wrangler/.wrangler/memory-orchestrator.generated.jsonc \
            "${EDGEMNEME_ORCHESTRATOR_PREVIOUS_VERSION:-}" \
            "edgemneme-ledger-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-orchestrator" \
            edgemneme-memory-orchestrator \
            "${EDGEMNEME_BOOTSTRAP_MODE:-false}"
          orchestrator_status=$?
          set -e
          if (( github_sync_status != 0 || gateway_status != 0 || orchestrator_status != 0 )); then
            echo "::error::One or more Worker rollbacks failed; inspect the original failed step and rollback logs." >&2
            exit 1
          fi

      - name: Remove rollback deployment configs
        if: always()
        run: >-
          rm -f --
          wrangler/.wrangler/memory-orchestrator.generated.jsonc
          wrangler/.wrangler/memory-gateway.generated.jsonc
          wrangler/.wrangler/github-sync.generated.jsonc
