          CAPTURED_GITHUB_SYNC_SECRET_STATE: ${{ needs.capture_production_state.outputs.github_sync_previous_secret_state }}
          CAPTURED_BOOTSTRAP_MODE: ${{ needs.capture_production_state.outputs.bootstrap_mode }}
          OBSERVED_ORCHESTRATOR_VERSION: ${{ steps.capture_core_versions.outputs.orchestrator_version }}
          OBSERVED_GATEWAY_VERSION: ${{ steps.capture_core_versions.outputs.gateway_version }}
          OBSERVED_GITHUB_SYNC_VERSION: ${{ steps.capture_core_versions.outputs.github_sync_version }}
          OBSERVED_GITHUB_SYNC_STATE: ${{ steps.capture_core_versions.outputs.github_sync_state }}
          OBSERVED_GITHUB_SYNC_SCHEDULE_STATE: ${{ steps.capture_core_versions.outputs.github_sync_schedule_state }}
          OBSERVED_GITHUB_SYNC_SECRET_STATE: ${{ steps.capture_core_versions.outputs.github_sync_secret_state }}
          OBSERVED_BOOTSTRAP_MODE: ${{ steps.capture_core_versions.outputs.bootstrap_mode }}
