            totalPages ??= info.total_pages;
            if (info.total_count !== totalCount || info.total_pages !== totalPages) {
              throw new Error("The Cloudflare Queue inventory changed during pagination.");
            }
            for (const queue of envelope.result) {
              if (
                typeof queue?.queue_id !== "string" || queue.queue_id.length === 0 ||
                typeof queue?.queue_name !== "string" || queue.queue_name.length === 0 ||
                queueIds.has(queue.queue_id) ||
                !Number.isSafeInteger(queue?.consumers_total_count) ||
                queue.consumers_total_count < 0 ||
                !Number.isSafeInteger(queue?.producers_total_count) ||
                queue.producers_total_count < 0 ||
